    wireCheckoutCard();
    wireOrderPanel();
    wireCustomerGate();
    wireReceiptCard();
  }

  // Lightweight per-second tick while a checkout form is open: updates only
  // text content (timers, computed bill), never touches any input's value.
  // While the Order panel is open, the tick must never rebuild its buttons —
  // just keep every active table's visible timer moving.
  function updateActiveTimersOnly(){
    var now = Date.now();
    (state.tablesAll||[]).forEach(function(t){
      if(t.data.status === "active"){
        var el = document.getElementById("tt-timer-"+t.id);
        if(el) el.textContent = fmtDuration(now - new Date(t.data.startedAt).getTime());
      }
    });
  }

  function updateLiveNumbersOnly(){
    var now = Date.now();
    (state.tablesAll||[]).forEach(function(t){
      if(t.data.status === "active" && t.id !== checkoutTableNum){
        var el = document.getElementById("tt-timer-"+t.id);
        if(el) el.textContent = fmtDuration(now - new Date(t.data.startedAt).getTime());
      }
    });

    var table = (state.tablesAll||[]).filter(function(t){ return t.id === checkoutTableNum; })[0];
    if(!table) return;
    var start = new Date(table.data.startedAt);
    var cfg = state.ratesCache || RATE_DEFAULTS;
    var rates = getEffectiveTableRate(table.id, cfg);
    var bill = computeSessionBill(start, new Date(), rates);

    setText("co-duration", fmtDuration(Date.now()-start.getTime()));
    setText("co-blocks", bill.blocks+' × '+BILLING_BLOCK_MINUTES+'min = '+Math.round(bill.totalMinutes)+' min');
    setText("co-happy", Math.round(bill.happyMinutes)+' min');
    setText("checkoutAmount", fmtMoney(bill.amount));

    var orderBill = orderBillFor(table);
    var discount = table.data.approvedDiscount ? (table.data.approvedDiscount.amount||0) : 0;
    var memberToggle = document.getElementById("co_memberToggle");
    if(memberToggle && memberToggle.checked){
      var member = findMembershipForCustomer(table.data.customerId, "table");
      var cafBase = orderBill.total;
      if(member){
        var ov = computeMemberOverage(start, bill.actualMinutes, member, rates);
        setText("co_memberOverage", ov.overageMinutes>0 ? ("Overage: "+ov.overageMinutes+" min beyond balance — "+fmtMoney(ov.amount)+" added to Cafeteria Payment below") : "");
        cafBase += ov.amount;
      } else {
        setText("co_memberOverage", "");
      }
      var alloc1 = allocateDiscount(0, cafBase, discount);
      setText("co_totalDisplay", fmtMoney(alloc1.cafSectionTotal));
    } else {
      setText("co_memberOverage", "");
      var alloc2 = allocateDiscount(bill.amount, orderBill.total, discount);
      setText("co_totalDisplay", fmtMoney(alloc2.timeSectionTotal + alloc2.cafSectionTotal));
    }
  }
  function setText(id, text){
    var el = document.getElementById(id);
    if(el) el.textContent = text;
  }

  // How much of a session a member's remaining hours cover, and what the
  // (block-rounded) overage costs if their balance runs out mid-session.
  // billedMinutes is already the 15-min-block-rounded total (same billing rule as
  // cash/credit tables). Membership hours are deducted from that billed total, not
  // the raw clock time. Any part beyond the member's remaining balance is priced
  // using the regular/happy split for that trailing window — no re-rounding, since
  // it's a sub-slice of an already-rounded block.
  // A discount always reduces the GRAND total, not just one section. It's taken
  // out of the Cafeteria section first, and any leftover spills into reducing
  // Table Time — so a discount bigger than the F&B total still fully applies
  // instead of silently being clamped away (this was a real bug: previously
  // the discount was capped within the Cafeteria section alone).
  function allocateDiscount(timeBase, cafBase, discount){
    var onCaf = Math.min(discount, cafBase);
    var remaining = discount - onCaf;
    var onTime = Math.min(remaining, timeBase);
    return {
      cafSectionTotal: Math.round((cafBase - onCaf)*100)/100,
      timeSectionTotal: Math.round((timeBase - onTime)*100)/100
    };
  }

  var MEMBERSHIP_BLOCK_MINUTES = 30; // deduction rounds to 30-min blocks — deliberately independent of the 15-min paid-billing block
  // `actualMinutes` is raw clock time (NOT pre-rounded to the 15-min paid
  // block) — this function does its own 30-min rounding to decide how much
  // to deduct from the membership, then prices whatever actual time is left
  // over (balance ran out) using the standard 15-min paid-billing block.
  function computeMemberOverage(start, actualMinutes, member, rates){
    var remainingHours = Math.max(0, (member.data.totalHours||0) - (member.data.hoursUsed||0));
    var remainingMinutes = remainingHours*60;

    var membershipBlocks = actualMinutes > 0 ? Math.ceil(actualMinutes/MEMBERSHIP_BLOCK_MINUTES - 1e-9) : 1;
    if(membershipBlocks < 1) membershipBlocks = 1;
    var membershipMinutesNeeded = membershipBlocks * MEMBERSHIP_BLOCK_MINUTES;

    var coveredMinutes = Math.min(membershipMinutesNeeded, remainingMinutes);
    var overageActualMinutes = Math.max(0, actualMinutes - coveredMinutes);

    if(overageActualMinutes <= 0){
      return {coveredMinutes: coveredMinutes, overageMinutes: 0, amount: 0, regularMinutes: 0, happyMinutes: 0};
    }

    var overageBlocks = Math.ceil(overageActualMinutes/BILLING_BLOCK_MINUTES - 1e-9);
    if(overageBlocks < 1) overageBlocks = 1;
    var overageBilledMinutes = overageBlocks * BILLING_BLOCK_MINUTES;

    var overageStart = new Date(start.getTime() + coveredMinutes*60000);
    var overageEnd = new Date(overageStart.getTime() + overageBilledMinutes*60000);
    var split = splitSessionMinutes(overageStart, overageEnd, rates);
    var amount = (split.regularMinutes/60)*rates.hourlyRate + (split.happyMinutes/60)*rates.happyHourRate;
    return {
      coveredMinutes: coveredMinutes, overageMinutes: Math.round(overageBilledMinutes),
      amount: Math.round(amount*100)/100,
      regularMinutes: split.regularMinutes, happyMinutes: split.happyMinutes
    };
  }

  async function startTable(id, customerId, customerName, customerMobile, membershipId, membershipCode){
    try{
      await state.db.collection("tables").doc(id).set({
        number: Number(id), status: "active",
        startedAt: new Date().toISOString(),
        startedBy: state.staffLabel || (state.role === "admin" ? "Admin" : ""),
        customerId: customerId || null, customerName: customerName || null, customerMobile: customerMobile || null,
        membershipId: membershipId || null, membershipCode: membershipCode || null,
        order: []
      });
      toast("Table "+id+" started"+(customerName ? " for "+customerName : ""));
    }catch(e){ toast("Couldn't start table"); }
  }

  // Every session — member or not — must be tied to a registered customer.
  // This gate runs before Start actually activates the table: search an
  // existing customer or register a new walk-in right here.
  function renderCustomerGateHtml(t){
    var custOptions = (state.customersCache||[]).map(function(c){
      var label = c.data.name + ((c.data.whatsappDisplay||c.data.whatsapp) ? ' ('+(c.data.whatsappDisplay||c.data.whatsapp)+')' : '');

  function findCustomerByGateLabel(label){
    label = (label||"").trim();
    if(!label) return null;
    return (state.customersCache||[]).filter(function(c){
      var built = c.data.name + ((c.data.whatsappDisplay||c.data.whatsapp) ? ' ('+(c.data.whatsappDisplay||c.data.whatsapp)+')' : '');
      return built === label;
    })[0] || null;
  }

  function wireCustomerGate(){
    var panel = document.getElementById("customerGateFor");
    if(!panel) return;
    var tableId = panel.getAttribute("data-table");
    var nameEl = document.getElementById("sg_name");
    var mobileEl = document.getElementById("sg_mobile");
    var noteEl = document.getElementById("sg_matchNote");

    nameEl.addEventListener("input", function(){
      var m = findCustomerByGateLabel(nameEl.value);
      if(m){
        mobileEl.value = m.data.whatsappDisplay || m.data.whatsapp || "";
        noteEl.textContent = "Existing customer ✓";
        noteEl.style.color = "var(--pl-pos)";
      } else {
        noteEl.textContent = nameEl.value ? "New customer — will be registered" : "";
        noteEl.style.color = "var(--muted)";
      }
    });

    document.getElementById("sg_cancelBtn").addEventListener("click", function(){
      startingTableNum = null;
      renderTableGrid(true);
    });

    document.getElementById("sg_confirmBtn").addEventListener("click", async function(){
      var name = (nameEl.value||"").trim();
      var mobile = (mobileEl.value||"").trim();
      if(!name){ toast("Customer name is required"); return; }
      if(!mobile || mobile.replace(/\D/g,"").length < 10){ toast("Enter a valid mobile number"); return; }

      var btn = document.getElementById("sg_confirmBtn");
      btn.disabled = true;
      try{
        var match = findCustomerByGateLabel(nameEl.value);
        var customerId, customerName, customerMobile;
        if(match){
          customerId = match.id;
          customerName = match.data.name;
          customerMobile = match.data.whatsappDisplay || match.data.whatsapp || mobile;
        } else {
          var waDigits = normalizeWa(mobile);
          var ref = await state.db.collection("customers").add({
            name: name, whatsapp: waDigits, whatsappDisplay: mobile, notes: "",
            createdAt: new Date().toISOString()
          });
          customerId = ref.id; customerName = name; customerMobile = mobile;
        }

        // If this customer has a membership, lock it to this table now —
        // before play even starts — so it can never be double-booked onto
        // another table or PS5 while this session is running.
        var member = findMembershipForCustomer(customerId, "table");
        var membershipId = null, membershipCode = null;
        if(member){
          var conflict = findMembershipConflict(member.id, "table", tableId);
          if(conflict){
            toast("This membership is already active on "+conflict+". Please finish the existing session first.");
            btn.disabled = false;
            return;
          }
          membershipId = member.id; membershipCode = member.data.code;
        }

        await startTable(tableId, customerId, customerName, customerMobile, membershipId, membershipCode);
        startingTableNum = null;
        renderTableGrid(true);
      }catch(e){
        toast("Couldn't start table");
        btn.disabled = false;
      }
    });
  }

  function activeMembers(resourceType){
    var today = (function(){ var n=new Date(); return n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-"+pad2(n.getDate()); })();
    return (state.membershipsCache||[]).filter(function(m){
      if(m.data.expiryDate < today || m.data.cancelled) return false;
      if(!resourceType) return true;
      var applies = m.data.appliesTo || "table"; // memberships created before this feature default to table-only
      return applies === resourceType || applies === "both";
    });
  }

  // The membership usable at checkout is never chosen by staff — it's looked
  // up strictly from the customer who was registered when the session
  // started (verified by customerId, the same identity backing their mobile
  // number and any membership code). If that customer has more than one
  // active membership for this resource, the one with the most remaining
  // balance is used; if none, returns null so the caller can show
  // "No active membership found for this customer."
  function findMembershipForCustomer(customerId, resourceType){
    if(!customerId) return null;
    var pool = activeMembers(resourceType).filter(function(m){ return m.data.customerId === customerId; });
    if(pool.length === 0) return null;
    pool.sort(function(a,b){
      var remA = (a.data.totalHours||0)-(a.data.hoursUsed||0);
      var remB = (b.data.totalHours||0)-(b.data.hoursUsed||0);
      return remB - remA;
    });
    return pool[0];
  }

  // A membership can only be "in play" on one resource at a time. Scans every
  // currently active/paused table and PS5 console (not just the current tab's
  // own data — both are cross-subscribed for exactly this) for one already
  // locked to this membership, and returns a human-readable location
  // ("Table 3", "PS5 #2") if found, else null.
  function findMembershipConflict(membershipId, excludeKind, excludeId){
    if(!membershipId) return null;
    var tableHit = (state.tablesAll||[]).filter(function(t){
      if(excludeKind === "table" && t.id === excludeId) return false;
      return t.data.status === "active" && t.data.membershipId === membershipId;
    })[0];
    if(tableHit) return "Table "+tableHit.id;
    var ps5Hit = (state.ps5All||[]).filter(function(c){
      if(excludeKind === "ps5" && c.id === excludeId) return false;
      return (c.data.status === "active" || c.data.status === "paused") && c.data.membershipId === membershipId;
    })[0];
    if(ps5Hit) return "PS5 #"+ps5Hit.id;
    return null;
  }

  // The F&B bill for a checkout comes from the table's own `order` array (built
  // via the Order panel while the table was active), not free-typed rows.
  function orderBillFor(table){
    var lines = (table.data.order || []).filter(function(x){ return !x.cancelled; });
    var subtotal = lines.reduce(function(s,x){ return s+x.amount; }, 0);
    var tax = lines.reduce(function(s,x){ return s + x.amount*(x.taxPercent||0)/100; }, 0);
    return {lines: lines, subtotal: Math.round(subtotal*100)/100, tax: Math.round(tax*100)/100, total: Math.round((subtotal+tax)*100)/100};
  }

  // ---------- Order panel (add F&B items to a table's running order while it's still active) ----------
  var orderSearch = "";

  function availableMenuItems(){
    return (state.tablesMenuAll||[]).filter(function(m){ return m.data.available !== false; });
  }

  function renderOrderPanelHtml(t){
    var order = (t.data.order || []).filter(function(x){ return !x.cancelled; });
    var subtotal = order.reduce(function(s,x){ return s+x.amount; }, 0);
    var tax = order.reduce(function(s,x){ return s + x.amount*(x.taxPercent||0)/100; }, 0);

    var menuHtml = "";
    if(orderSearch){
      var matches = availableMenuItems().filter(function(m){ return m.data.name.toLowerCase().indexOf(orderSearch) !== -1; })
        .sort(function(a,b){ return a.data.name.localeCompare(b.data.name); });
      menuHtml = matches.length === 0
        ? '<div class="empty">No menu items match "'+escapeHtml(orderSearch)+'".</div>'
        : '<div class="list">' + matches.map(function(m){
            var outOfStock = m.data.trackStock && (m.data.stockQty||0) <= 0;
            var stockNote = m.data.trackStock ? (' · '+(outOfStock?'Out of stock':(m.data.stockQty||0)+' left')) : '';
            return '<div class="row">' +
              '<div class="main"><div class="t1">'+escapeHtml(m.data.name)+'</div><div class="t2">'+fmtMoney(m.data.price)+(m.data.taxPercent?' +'+m.data.taxPercent+'% tax':'')+stockNote+'</div></div>' +
              (outOfStock
                ? '<button class="btn-ghost" style="border:1px solid var(--border); color:var(--muted);" disabled>Out of stock</button>'
                : '<button class="btn-primary" style="padding:6px 12px;" data-add-item="'+m.id+'">Add</button>') +
            '</div>';
          }).join("") + '</div>';
    }

    var pendingCancelLineIds = {};
    (state.myPendingRequests||[]).forEach(function(r){
      if(r.data.type === "cancel_item" && r.data.tableId === t.id && r.data.status === "pending") pendingCancelLineIds[r.data.lineId] = true;
    });

    var orderRows = order.length === 0
      ? '<div class="empty">No items ordered yet.</div>'
      : '<div class="list">' + order.map(function(line){
          var pending = pendingCancelLineIds[line.id];
          return '<div class="row">' +
            '<div class="main"><div class="t1">'+escapeHtml(line.name)+(pending?' <span class="badge" style="--chip:#b45309;">Cancel pending</span>':'')+'</div>' +
              '<div class="t2">'+line.qty+' × '+fmtMoney(line.rate)+' = '+fmtMoney(line.amount)+(line.taxPercent?' +'+line.taxPercent+'% tax':'')+'</div></div>' +
            (state.role === "admin" ? (
              '<button class="btn-ghost" style="border:1px solid var(--border); padding:4px 9px;" data-qty-minus="'+line.id+'">−</button>' +
              '<button class="btn-ghost" style="border:1px solid var(--border); padding:4px 9px; margin-left:4px;" data-qty-plus="'+line.id+'">+</button>' +
              '<button class="btn-danger" style="margin-left:6px;" data-cancel-line="'+line.id+'">Cancel</button>'
            ) : (
              pending
                ? '<span class="hint" style="margin:0;">Waiting for admin</span>'
                : '<button class="btn-ghost" style="border:1px solid var(--border); padding:4px 9px;" data-request-cancel="'+line.id+'" data-name="'+escapeHtml(line.name)+'" data-amount="'+line.amount+'">Request Cancel</button>'
            )) +
          '</div>';
        }).join("") + '</div>';

    return '<div class="card" id="orderPanelFor" data-table="'+t.id+'" style="grid-column:1/-1; border-color:var(--accent);">' +
      '<h2>Order — Table '+t.id+'</h2>' +
      '<div class="field-row"><div style="flex:1 1 100%"><input type="text" id="ord_search" placeholder="Search menu…" value="'+escapeHtml(orderSearch)+'" autocomplete="off"></div></div>' +
      '<div id="ord_searchResults">'+menuHtml+'</div>' +
      '<h2 style="font-size:13px; margin-top:14px;">Current Order</h2>' +
      orderRows +
      '<div class="totals-bar" style="flex-direction:column; gap:3px;">' +
        '<div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>'+fmtMoney(subtotal)+'</span></div>' +
        (tax>0 ? '<div style="display:flex;justify-content:space-between;"><span>Tax</span><span>'+fmtMoney(tax)+'</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-weight:700;"><span>Order Total</span><span>'+fmtMoney(subtotal+tax)+'</span></div>' +
      '</div>' +
      '<div class="form-actions"><button class="btn-primary" id="ord_doneBtn">Done</button></div>' +
    '</div>';
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // Adjusts a menu item's stock and logs the movement. Only items with
  // trackStock=true are touched; everything else is a silent no-op. Never
  // blocks/throws on the caller — inventory bookkeeping shouldn't stop an
  // order from going through if the write happens to fail.
  async function adjustStock(menuItemId, deltaQty, reason, opts){
    opts = opts || {};
    if(!deltaQty && !opts.forceTrackStock) return;
    try{
      var snap = await state.db.collection("menuItems").doc(menuItemId).get();
      if(!snap || !snap.exists) return;
      var data = snap.data();
      if(!data.trackStock && !opts.forceTrackStock) return;
      var updateBody = {};
      if(deltaQty){
        var newQty = Math.max(0, (data.stockQty||0) + deltaQty);
        updateBody.stockQty = newQty;
      }
      if(opts.forceTrackStock) updateBody.trackStock = true;
      if(typeof opts.unitCost === "number"){
        updateBody.lastPurchasePrice = opts.unitCost;
        updateBody.lastPurchaseDate = opts.purchaseDate || new Date().toISOString().slice(0,10);
      }
      await state.db.collection("menuItems").doc(menuItemId).update(updateBody);
      if(deltaQty){
        await state.db.collection("stockMovements").add({
          menuItemId: menuItemId, itemName: data.name,
          type: deltaQty > 0 ? "in" : "out", qty: Math.abs(deltaQty), reason: reason || "",
          unitCost: (typeof opts.unitCost === "number") ? opts.unitCost : null,
          resultingQty: updateBody.stockQty !== undefined ? updateBody.stockQty : data.stockQty,
          enteredBy: currentIdentityLabel(), createdAt: new Date().toISOString()
        });
      }
    }catch(e){ /* best-effort */ }
  }

  // Staff can't cancel items or apply discounts directly — they file a
  // request here, and it only takes effect once an admin approves it
  // (see renderApprovalsPanel / resolveApproval).
  async function requestApproval(type, tableId, lineId, amount, itemName, reason){
    try{
      await state.db.collection("approvalRequests").add({
        type: type, tableId: tableId, lineId: lineId, amount: amount||null, itemName: itemName||null,
        reason: reason||"", requestedBy: currentIdentityLabel(), requestedByRole: state.role,
        requestedAt: new Date().toISOString(), status: "pending"
      });
      toast(type === "cancel_item" ? "Cancellation requested — waiting for admin approval" : "Discount requested — waiting for admin approval");
    }catch(e){ toast("Couldn't send request"); }
  }

  // Every deletion anywhere in the app logs a self-approved "delete" audit
  // record (only admin can delete, so there's nothing separate to approve)
  // — this is what makes deletions show up in the Audit Report with amount,
  // who did it, and when, even though the underlying record is gone.
  // One-shot read of a live query (not a standing subscription) — used for
  // lookups like "find the tableSessions doc for this sessionKey". Defers the
  // unsub to the next tick since onSnapshot can fire synchronously on
  // subscribe, before the `var unsub = ...` assignment itself has completed.
  function queryOnce(collectionQuery){
    return new Promise(function(resolve){
      var unsub = collectionQuery.onSnapshot(function(snap){
        resolve(snap.docs.map(function(d){ return {id:d.id, data:d.data()}; }));
        setTimeout(function(){ if(typeof unsub === "function") unsub(); }, 0);
      }, function(){ resolve([]); });
    });
  }

  async function logDeletion(entryType, description, amount, tableNumber, paymentMethod){
    var me = currentIdentityLabel();
    try{
      await state.db.collection("approvalRequests").add({
        type: "delete", entryType: entryType||"Entry", tableId: (tableNumber===undefined||tableNumber===null)?null:tableNumber,
        itemName: description, amount: amount||0, paymentMethod: paymentMethod||null, reason: "",
        requestedBy: me, requestedByRole: state.role, requestedAt: new Date().toISOString(),
        status: "approved", resolvedBy: me, resolvedByRole: state.role, resolvedAt: new Date().toISOString()
      });
    }catch(e){ /* best-effort — never block the deletion itself */ }
  }

  // Logs a record edit with the exact old/new value of every field that
  // actually changed — used anywhere a person can edit an existing record
  // (customers, memberships, shifts, menu items, ...) so the audit trail shows
  // precisely what changed, not just that "something" changed.
  // `changes` is an array of {field, oldValue, newValue}; entries where
  // oldValue === newValue are skipped automatically. No-ops (nothing changed)
  // write nothing.
  async function logEdit(entryType, entityLabel, changes){
    var real = (changes||[]).filter(function(c){ return String(c.oldValue) !== String(c.newValue); });
    if(real.length === 0) return;
    var me = currentIdentityLabel();
    try{
      await state.db.collection("approvalRequests").add({
        type: "edit", entryType: entryType||"Entry", itemName: entityLabel||"", changes: real,
        requestedBy: me, requestedByRole: state.role, requestedAt: new Date().toISOString(),
        status: "approved", resolvedBy: me, resolvedByRole: state.role, resolvedAt: new Date().toISOString()
      });
    }catch(e){ /* best-effort — never block the edit itself */ }
  }

  // Restores stock for a sale's F&B items (call when a sale with an `items`
  // array is deleted) or removes stock added by a purchase (call when a
  // grocery entry with `items` is deleted) — pass the sign via `direction`.
  async function reverseInventoryForItems(items, direction, reason){
    if(!items || !items.length) return;
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(!it.menuItemId || !it.qty) continue;
      await adjustStock(it.menuItemId, direction * Number(it.qty), reason);
    }
  }

  // A table checkout can write several linked docs (table-time sale, cafeteria
  // sale, overage sale, plus one tableSessions record) all sharing the same
  // sessionKey. Deleting any one of them must also remove the tableSessions
  // record, so that session's revenue/hours/count fully disappear from the
  // Table Usage report — a "ghost" partial session is worse than an exact one.
  // A member-covered session deducted hours from the membership and logged a
  // membershipDeductions record — deleting the session's sale must give that
  // time back (subtract it from hoursUsed) and remove the log entry, since
  // that session no longer happened as far as the membership is concerned.
  async function reverseMembershipDeductionsFor(sessionKey, tableNumber, startTime){
    var docs;
    if(sessionKey){
      docs = await queryOnce(state.db.collection("membershipDeductions").where("sessionKey","==",sessionKey));
    } else if(tableNumber !== undefined && tableNumber !== null && startTime){
      docs = await queryOnce(state.db.collection("membershipDeductions").where("tableNumber","==",tableNumber).where("startTime","==",startTime));
    } else {
      docs = [];
    }
    for(var i=0;i<docs.length;i++){
      var ded = docs[i].data;
      if(ded.membershipId){
        try{
          var msnap = await state.db.collection("memberships").doc(ded.membershipId).get();
          if(msnap && msnap.exists){
            var newUsed = Math.max(0, (msnap.data().hoursUsed||0) - (Number(ded.hoursUsed)||0));
            await state.db.collection("memberships").doc(ded.membershipId).update({hoursUsed: Math.round(newUsed*100)/100});
          }
        }catch(e){ /* best-effort */ }
      }
      await state.db.collection("membershipDeductions").doc(docs[i].id).delete();
    }
  }
  async function reverseTableSessionIfLinked(sessionKey){
    if(!sessionKey) return;
    var docs = await queryOnce(state.db.collection("tableSessions").where("sessionKey","==",sessionKey));
    for(var i=0;i<docs.length;i++){
      var s = docs[i].data;
      if(s.usingMember) await reverseMembershipDeductionsFor(sessionKey, s.tableNumber, s.startTime);
      await state.db.collection("tableSessions").doc(docs[i].id).delete();
    }
  }
  // Fallback for sales entries created before sessionKey existed — matches by
  // the same table number + start time, which was already unique per session.
  async function reverseTableSessionByTableAndStart(tableNumber, startTime){
    if(tableNumber===undefined || tableNumber===null || !startTime) return;
    var docs = await queryOnce(state.db.collection("tableSessions").where("tableNumber","==",tableNumber).where("startTime","==",startTime));
    for(var i=0;i<docs.length;i++){
      var s = docs[i].data;
      if(s.usingMember) await reverseMembershipDeductionsFor(s.sessionKey, tableNumber, startTime);
      await state.db.collection("tableSessions").doc(docs[i].id).delete();
    }
  }
  // Same idea as tables, for PS5 — a deleted PS5 sale must remove its linked
  // ps5Sessions record too, so it drops out of the PS5 usage/revenue report.
  async function reversePs5SessionIfLinked(sessionKey){
    if(!sessionKey) return;
    var docs = await queryOnce(state.db.collection("ps5Sessions").where("sessionKey","==",sessionKey));
    for(var i=0;i<docs.length;i++){
      var s = docs[i].data;
      if(s.usingMember) await reverseMembershipDeductionsFor(sessionKey, null, null);
      await state.db.collection("ps5Sessions").doc(docs[i].id).delete();
    }
  }
  // Routes to the right session-reversal by sessionKey's prefix (tables use
  // "T<num>_...", PS5 uses "P5_<num>_..."), so one central call in
  // deleteWithAudit correctly handles both without the caller needing to know.
  async function reverseLinkedSession(sessionKey, tableNumber, startTime){
    if(sessionKey && sessionKey.indexOf("P5_") === 0){
      await reversePs5SessionIfLinked(sessionKey);
    } else if(sessionKey){
      await reverseTableSessionIfLinked(sessionKey);
    } else if(tableNumber !== undefined && tableNumber !== null && startTime){
      await reverseTableSessionByTableAndStart(tableNumber, startTime);
    }
  }

  // Fetches the doc fresh, reverses any inventory/table-session effect, logs
  // the audit record, then deletes — in that order, so the audit trail and
  // stock are correct even if the delete itself somehow fails partway.
  async function deleteWithAudit(collection, id, opts){
    opts = opts || {};
    try{
      var snap = await state.db.collection(collection).doc(id).get();
      var data = (snap && snap.exists) ? snap.data() : null;
      if(data && opts.reverseInventory) await opts.reverseInventory(data);
      if(data) await reverseLinkedSession(data.sessionKey, data.tableNumber, data.startTime);
      var desc = (data && opts.describe) ? opts.describe(data) : (collection+" entry");
      var amount = (data && opts.getAmount) ? (Number(opts.getAmount(data))||0) : 0;
      var tableNumber = (data && opts.getTableNumber) ? opts.getTableNumber(data) : null;
      var paymentMethod = (data && opts.getPaymentMethod) ? opts.getPaymentMethod(data) : null;
      await logDeletion(opts.entryType, desc, amount, tableNumber, paymentMethod);
      await state.db.collection(collection).doc(id).delete();
      return true;
    }catch(e){
      return false;
    }
  }

  // Shared describer/reverser for "sales" docs, used wherever a sale can be
  // deleted (POS list, Credit tab) so the wording and inventory/session
  // handling stay consistent no matter which screen the delete happens from.
  function describeSaleForAudit(d){
    if(d.source === "membership") return "Membership sale"+(d.membershipCode?" ("+d.membershipCode+")":"")+" — membership cancelled";
    if(d.source === "ps5" && d.ps5Number !== undefined && d.ps5Number !== null) return "PS5 #"+d.ps5Number+" sale"+(d.customerName?" — "+d.customerName:"");
    if(d.tableNumber !== undefined && d.tableNumber !== null){
      return (d.source === "cafeteria" ? "Table "+d.tableNumber+" Cafeteria sale" : "Table "+d.tableNumber+" sale");
    }
    return (d.source === "cafeteria" ? "Cafeteria sale" : "Board sale") + (d.saleType === "direct" ? " (Direct)" : "");
  }
  // Cancels (never hard-deletes) the membership a deleted sale paid for — the
  // membership stays visible in Audit and keeps any genuine play history it
  // already has (membershipDeductions), it just stops counting anywhere as
  // active/sold/revenue. Matched via membershipCode, the same link the sale
  // and membership already shared, so no new field is needed.
  async function reverseMembershipForSale(d){
    if(d.source !== "membership" || !d.membershipCode) return;
    var docs = await queryOnce(state.db.collection("memberships").where("code","==",d.membershipCode));
    for(var i=0;i<docs.length;i++){
      await state.db.collection("memberships").doc(docs[i].id).update({
        cancelled: true, cancelledAt: new Date().toISOString(),
        cancelledReason: "Membership sale deleted from POS", cancelledBy: currentIdentityLabel()
      });
    }
  }
  async function reverseSaleEffects(d){
    // A sold F&B item deducted stock at sale time — deleting the sale must give it back.
    if(d.items && d.items.length) await reverseInventoryForItems(d.items, 1, "Sale deleted — stock restored");
    await reverseMembershipForSale(d);
    // sessionKey (if any) is handled centrally in deleteWithAudit, not here.
  }

      '<div style="flex:2 1 140px;"><label>Note (optional)</label><input type="text" id="rs_note" placeholder="e.g. supplier delivery" style="width:100%; box-sizing:border-box;"></div>' +

  async function resolveApproval(requestId, approve){
    var req = (state.pendingApprovals||[]).filter(function(r){ return r.id === requestId; })[0];
    if(!req) return;
    var d = req.data;
    var me = currentIdentityLabel();
    try{
      if(approve && d.type === "cancel_item"){
        await mutateTableOrder(d.tableId, function(order){
          var line = order.filter(function(l){ return l.id === d.lineId; })[0];
          if(!line) return false;
          line.cancelled = true;
          line.cancelledBy = me+" (approved, requested by "+d.requestedBy+")";
          line.cancelledAt = new Date().toISOString();
        }, "One moment");
      } else if(approve && d.type === "discount"){
        await state.db.collection("tables").doc(d.tableId).update({
          approvedDiscount: {amount: d.amount, reason: d.reason||"", approvedBy: me, requestedBy: d.requestedBy, approvedAt: new Date().toISOString()}
        });
      }
      await state.db.collection("approvalRequests").doc(requestId).update({
        status: approve ? "approved" : "rejected", resolvedBy: me, resolvedByRole: state.role, resolvedAt: new Date().toISOString()
      });
      toast(approve ? "Approved" : "Rejected");
    }catch(e){ toast("Couldn't resolve request"); }
  }

  var orderWriteBusy = {}; // tableId -> true while a write to that table's order is in flight

  // Every order mutation reads the table doc FRESH (not from the cached
  // onSnapshot state) and only one write is ever in flight per table at a
  // time — the platform's db is last-writer-wins with no transactions, so
  // building a new array from a stale local copy while a previous tap is
  // still writing can silently discard that first change.
  function writeErrorMessage(){
    if(state.canWrite === false) return "Couldn't save. If you've just been added as an editor, tap \"Try again\" on the banner above.";
    return "Couldn't save — try again";
  }

  // The platform gives no separate "permission denied" code — a refused write
  // looks identical to a malformed one — so a real write failing is the only
  // reliable signal. We never block a write pre-emptively on this; we only
  // show the banner AFTER an actual write is refused, and the banner itself
  // can re-check and clear on the next successful save.
  function markWriteDenied(){
    state.canWrite = false;
    var banner = document.getElementById("writeAccessBanner");
    if(banner){
      banner.innerHTML = '⚠ A save just got refused — this Claude account may only have view access to this app\'s data. ' +
        'If you\'ve already been added as an editor/collaborator, it can take a moment to take effect. ' +
        '<button id="wb_retryBtn" style="margin-left:8px; background:#fff; color:#7c2d12; border:none; border-radius:6px; padding:3px 10px; font-weight:700; cursor:pointer;">Try again</button>';
      banner.style.display = "block";
      var btn = document.getElementById("wb_retryBtn");
      if(btn) btn.addEventListener("click", function(){
        state.canWrite = null; // don't assume — let the very next write decide fresh
        banner.style.display = "none";
        toast("OK — try your last action again");
      });
    }
  }
  function markWriteOk(){
    if(state.canWrite === false){
      state.canWrite = true;
      var banner = document.getElementById("writeAccessBanner");
      if(banner) banner.style.display = "none";
    }
  }

  async function mutateTableOrder(tableId, mutatorFn, busyMsg){
    if(orderWriteBusy[tableId]){ toast(busyMsg || "Still saving the last change — one moment"); return false; }
    orderWriteBusy[tableId] = true;
    try{
      var snap = await state.db.collection("tables").doc(tableId).get();
      var data = (snap && snap.exists) ? snap.data() : null;
      if(!data){ toast("Couldn't load the table"); return false; }
      var order = (data.order || []).slice();
      var result = mutatorFn(order);
      if(result === false) return false; // mutator signals "nothing to do"
      await state.db.collection("tables").doc(tableId).update({order: order});
      markWriteOk();
      return true;
    }catch(e){
      markWriteDenied();
      toast(writeErrorMessage());
      return false;
    }finally{
      orderWriteBusy[tableId] = false;
    }
  }

  async function addMenuItemToOrder(tableId, menuItemId){
    var menuItem = (state.tablesMenuAll||[]).filter(function(m){ return m.id === menuItemId; })[0];
    if(!menuItem) return;
    if(menuItem.data.trackStock && (menuItem.data.stockQty||0) <= 0){ toast("Out of stock"); return; }
    var ok = await mutateTableOrder(tableId, function(order){
      var existing = order.filter(function(l){ return l.menuItemId === menuItemId && !l.cancelled; })[0];
      if(existing){
        existing.qty += 1;
        existing.amount = Math.round(existing.qty * existing.rate * 100) / 100;
      } else {
        order.push({
          id: uid(), menuItemId: menuItemId, name: menuItem.data.name,
          qty: 1, rate: menuItem.data.price, taxPercent: menuItem.data.taxPercent||0,
          amount: menuItem.data.price, cancelled: false,
          addedBy: state.staffLabel || (state.role==="admin"?"Admin":""), addedAt: new Date().toISOString()
        });
      }
    }, "Adding the last item — one moment");
    if(ok) await adjustStock(menuItemId, -1, "Ordered — Table "+tableId);
  }

  async function changeOrderQty(tableId, lineId, delta){
    var menuItemIdRef = null, actualDelta = 0;
    var ok = await mutateTableOrder(tableId, function(order){
      var line = order.filter(function(l){ return l.id === lineId; })[0];
      if(!line) return false;
      var oldQty = line.qty;
      var newQty = Math.max(1, oldQty + delta);
      actualDelta = newQty - oldQty;
      if(actualDelta === 0) return false; // already at the floor; nothing to change
      menuItemIdRef = line.menuItemId;
      line.qty = newQty;
      line.amount = Math.round(line.qty * line.rate * 100) / 100;
    }, "Still saving the last change — one moment");
    if(ok && menuItemIdRef){
      await adjustStock(menuItemIdRef, -actualDelta, (actualDelta>0?"Increased":"Decreased")+" qty — Table "+tableId);
    }
  }

  async function cancelOrderLine(tableId, lineId){
    var menuItemIdRef = null, qtyRef = 0, lineAmount = 0, lineName = "";
    var ok = await mutateTableOrder(tableId, function(order){
      var line = order.filter(function(l){ return l.id === lineId; })[0];
      if(!line) return false;
      menuItemIdRef = line.menuItemId; qtyRef = line.qty; lineAmount = line.amount; lineName = line.name;
      line.cancelled = true;
      line.cancelledBy = state.staffLabel || "Admin";
      line.cancelledAt = new Date().toISOString();
    }, "Still saving the last change — one moment");
    if(ok){
      toast("Item cancelled");
      if(menuItemIdRef) await adjustStock(menuItemIdRef, qtyRef, "Cancelled — Table "+tableId+" (restored)");
      // Admin cancelling directly (no approval queue needed) still must be
      // audit-logged — this is a self-approved record, same pattern as deletions,
      // so admin actions are never invisible in the audit trail.
      var me = currentIdentityLabel();
      try{
        await state.db.collection("approvalRequests").add({
          type: "cancel_item", tableId: tableId, lineId: lineId, amount: lineAmount, itemName: lineName, reason: "",
          requestedBy: me, requestedByRole: state.role, requestedAt: new Date().toISOString(),
          status: "approved", resolvedBy: me, resolvedByRole: state.role, resolvedAt: new Date().toISOString()
        });
      }catch(e){ /* best-effort — never block the cancellation itself */ }
    }
  }

  function wireCheckoutCard(){
    var memberToggle = document.getElementById("co_memberToggle");
    if(!memberToggle) return;
    var cardEl = document.getElementById("checkoutCardFor");
    var tableId = cardEl.getAttribute("data-table");

    function lockedTableMember(){
      var table = state.tablesAll.filter(function(t){ return t.id === tableId; })[0];
      if(!table) return null;
      return findMembershipForCustomer(table.data.customerId, "table");
    }

    function currentOrderTotal(){
      var table = state.tablesAll.filter(function(t){ return t.id === tableId; })[0];
      return table ? orderBillFor(table).total : 0;
    }
    function currentApprovedDiscount(){
      var table = state.tablesAll.filter(function(t){ return t.id === tableId; })[0];
      return (table && table.data.approvedDiscount) ? (table.data.approvedDiscount.amount||0) : 0;
    }
    function currentOverage(){
      if(!memberToggle.checked) return 0;
      var table = state.tablesAll.filter(function(t){ return t.id === tableId; })[0];
      if(!table) return 0;
      var start = new Date(table.data.startedAt);
      var cfg = state.ratesCache || RATE_DEFAULTS;
      var rates = getEffectiveTableRate(tableId, cfg);
      var bill = computeSessionBill(start, new Date(), rates);
      var member = lockedTableMember();
      if(!member) return 0;
      return computeMemberOverage(start, bill.actualMinutes, member, rates).amount;
    }

    function refreshMemberInfo(){
      var infoEl = document.getElementById("co_memberInfo");
      if(!memberToggle.checked){ infoEl.style.display = "none"; return; }
      infoEl.style.display = "";
      var member = lockedTableMember();
      if(!member){
        infoEl.textContent = "No active membership found for this customer.";
        infoEl.style.color = "var(--pl-neg)";
        return;
      }
      var remaining = (member.data.totalHours||0) - (member.data.hoursUsed||0);
      infoEl.textContent = "Member: "+member.data.name+" ("+member.data.code+") — "+remaining.toFixed(1)+"h remaining"+(remaining<=0?" — no hours left, session will be charged as overage":"");
      infoEl.style.color = remaining>0 ? "var(--pl-pos)" : "#b45309";
    }

    function refreshAll(){
      var amtEl = document.getElementById("checkoutAmount");
      var timeAmount = parseFloat((amtEl.textContent||"0").replace(/[^\d.]/g,"")) || 0;
      var cafTotal = currentOrderTotal();
      var overageAmt = currentOverage();
      var discount = currentApprovedDiscount();
      var timeBase = memberToggle.checked ? 0 : timeAmount;
      var cafBase = cafTotal + overageAmt;
      var alloc = allocateDiscount(timeBase, cafBase, discount);

      document.getElementById("co_timePaymentWrap").style.display = memberToggle.checked ? "none" : "";
      refreshMemberInfo();

      var overageEl = document.getElementById("co_memberOverage");
      if(memberToggle.checked){
        var table = state.tablesAll.filter(function(t){ return t.id === tableId; })[0];
        var start = new Date(table.data.startedAt);
        var cfg = state.ratesCache || RATE_DEFAULTS;
        var rates = getEffectiveTableRate(tableId, cfg);
        var bill = computeSessionBill(start, new Date(), rates);
        var member = lockedTableMember();
        if(member){
          var ov = computeMemberOverage(start, bill.actualMinutes, member, rates);
          overageEl.textContent = ov.overageMinutes>0 ? ("Overage: "+ov.overageMinutes+" min beyond balance — "+fmtMoney(ov.amount)+" added to Cafeteria Payment below") : "";
        } else { overageEl.textContent = ""; }
      } else { overageEl.textContent = ""; }

      var grandTotal = alloc.timeSectionTotal + alloc.cafSectionTotal;
      document.getElementById("co_totalDisplay").textContent = fmtMoney(grandTotal);
    }

    memberToggle.addEventListener("change", refreshAll);

    wirePaymentSection("co_time", function(){
      var amtEl = document.getElementById("checkoutAmount");
      var timeAmount = parseFloat((amtEl.textContent||"0").replace(/[^\d.]/g,"")) || 0;
      var alloc = allocateDiscount(memberToggle.checked ? 0 : timeAmount, currentOrderTotal()+currentOverage(), currentApprovedDiscount());
      return alloc.timeSectionTotal;
    }, refreshAll);
    wirePaymentSection("co_caf", function(){
      var amtEl = document.getElementById("checkoutAmount");
      var timeAmount = parseFloat((amtEl.textContent||"0").replace(/[^\d.]/g,"")) || 0;
      var alloc = allocateDiscount(memberToggle.checked ? 0 : timeAmount, currentOrderTotal()+currentOverage(), currentApprovedDiscount());
      return alloc.cafSectionTotal;
    }, refreshAll);

    var discApplyBtn = document.getElementById("co_discApplyBtn");
    if(discApplyBtn) discApplyBtn.addEventListener("click", async function(){
      var amt = parseFloat(document.getElementById("co_discAmt").value);
      if(isNaN(amt) || amt <= 0){ toast("Enter a valid discount amount"); return; }
      var reason = (document.getElementById("co_discReason").value||"").trim();
      discApplyBtn.disabled = true;
      try{
        var me = currentIdentityLabel();
        await state.db.collection("tables").doc(tableId).update({
          approvedDiscount: {amount: amt, reason: reason, approvedBy: me, approvedAt: new Date().toISOString()}
        });
        // Admin applying directly (no approval queue needed) still must be
        // audit-logged — self-approved, same pattern as deletions/cancellations.
        try{
          await state.db.collection("approvalRequests").add({
            type: "discount", tableId: tableId, lineId: null, amount: amt, itemName: null, reason: reason,
            requestedBy: me, requestedByRole: state.role, requestedAt: new Date().toISOString(),
            status: "approved", resolvedBy: me, resolvedByRole: state.role, resolvedAt: new Date().toISOString()
          });
        }catch(e){ /* best-effort — never block the discount itself */ }
        toast("Discount applied");
        renderTableGrid(true);
      }catch(e){ toast("Couldn't apply discount"); discApplyBtn.disabled = false; }
    });
    var discRequestBtn = document.getElementById("co_discRequestBtn");
    if(discRequestBtn) discRequestBtn.addEventListener("click", function(){
      var amt = parseFloat(document.getElementById("co_discAmt").value);
      if(isNaN(amt) || amt <= 0){ toast("Enter a valid discount amount"); return; }
      var reason = (document.getElementById("co_discReason").value||"").trim();
      if(!reason){ toast("A reason is required for a discount request"); return; }
      requestApproval("discount", tableId, null, amt, null, reason);
    });

    document.getElementById("co_cancelBtn").addEventListener("click", function(){
      checkoutTableNum = null;
      renderTableGrid(true);
    });
    document.getElementById("co_confirmBtn").addEventListener("click", function(){
      confirmCheckout(this.getAttribute("data-table"));
    });

    refreshAll();
  }

  function findMemberByLabel(label, resourceType){
    label = (label||"").trim();
    if(!label) return null;
    var pool = activeMembers(resourceType);
    var m = pool.filter(function(x){
      var remaining = (x.data.totalHours||0) - (x.data.hoursUsed||0);
      var built = x.data.name+' ('+x.data.code+') — '+remaining.toFixed(1)+'h left';
      return built === label;
    })[0];
    if(m) return m;
    // fallback: allow matching by code alone
    var codeMatch = label.match(/\(([A-Z0-9]+)\)/);
    var code = codeMatch ? codeMatch[1] : label.toUpperCase();
    return pool.filter(function(x){ return x.data.code === code; })[0] || null;
  }

  function billNumber(tableId){
    var d = new Date();
    return "RS-"+tableId+"-"+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds());

  // Writes one sales entry per payment line (or a single entry if not split).
  // `amountFor(method)` lets a combined section (e.g. cafeteria+overage) route
  // each line's rupees across more than one underlying "source" entry.
  async function writePaymentLines(paymentResult, totalAmount, writeOneFn){
    if(paymentResult.split){
      for(var i=0;i<paymentResult.lines.length;i++){
        var line = paymentResult.lines[i];
        await writeOneFn(line.amount, line.method, line.reference, line.party, line);
      }
    } else {
      await writeOneFn(totalAmount, paymentResult.method, paymentResult.reference, paymentResult.party, paymentResult);
    }
  }

  async function confirmCheckout(id){
    var table = state.tablesAll.filter(function(t){ return t.id === id; })[0];
    if(!table) return;
    var usingMember = document.getElementById("co_memberToggle").checked;
    var orderBill = orderBillFor(table);
    var member = null;

    if(usingMember){
      member = findMembershipForCustomer(table.data.customerId, "table");
      if(!member){ toast("No active membership found for this customer."); return; }
    }

    var cfg = state.ratesCache || await getRatesConfig();
    state.ratesCache = cfg;
    var rates = getEffectiveTableRate(id, cfg);
    var start = new Date(table.data.startedAt);
    var end = new Date();
    var bill = computeSessionBill(start, end, rates);

    var overage = usingMember ? computeMemberOverage(start, bill.actualMinutes, member, rates) : null;
    var overageAmt = overage ? overage.amount : 0;
    var discount = table.data.approvedDiscount ? (table.data.approvedDiscount.amount||0) : 0;
    var timeBase = usingMember ? 0 : bill.amount;
    var cafBase = orderBill.total + overageAmt;
    var alloc = allocateDiscount(timeBase, cafBase, discount);
    var timeSectionTotal = alloc.timeSectionTotal;
    var cafSectionTotal = alloc.cafSectionTotal;

    var timePayment = null;
    if(!usingMember && timeSectionTotal > 0){
      timePayment = readPaymentSection("co_time", timeSectionTotal);
      if(!timePayment) return;
    }
    var cafPayment = null;
    if(cafSectionTotal > 0){
      cafPayment = readPaymentSection("co_caf", cafSectionTotal);
      if(!cafPayment) return;
    }

    var btn = document.getElementById("co_confirmBtn");
    btn.disabled = true;

    var today = end.getFullYear()+"-"+pad2(end.getMonth()+1)+"-"+pad2(end.getDate());
    var enteredBy = state.staffLabel || (state.role === "admin" ? "Admin" : "");
    var receiptPayments = []; // {label, amount, method, reference}
    // Ties every sales entry from this one checkout to the same tableSessions
    // record, so deleting any of them can find and reverse the whole session's
    // effect on the Table Usage report instead of leaving a stale ghost session.
    var sessionKey = "T"+id+"_"+table.data.startedAt;

    try{
      if(usingMember){
        var coveredHours = overage.coveredMinutes / 60;
        var newHoursUsed = Math.round(((member.data.hoursUsed||0) + coveredHours) * 100) / 100;
        var remainingAfter = Math.round(((member.data.totalHours||0) - newHoursUsed) * 100) / 100;
        await state.db.collection("membershipDeductions").add({
          membershipId: member.id, membershipCode: member.data.code, memberName: member.data.name,
          customerId: table.data.customerId||null, customerName: table.data.customerName||member.data.name,
          customerMobile: table.data.customerMobile||member.data.mobile||null,
          tableNumber: Number(id), sessionKey: sessionKey, startTime: table.data.startedAt, endTime: end.toISOString(),
          playedMinutes: Math.round(bill.actualMinutes*100)/100, minutesUsed: Math.round(overage.coveredMinutes),
          hoursUsed: Math.round(coveredHours*100)/100, remainingHoursAfter: remainingAfter,
          date: today, enteredBy: enteredBy, createdAt: new Date().toISOString()
        });
        await state.db.collection("memberships").doc(member.id).update({
          hoursUsed: newHoursUsed
        });
      } else if(timePayment){
        await writePaymentLines(timePayment, timeSectionTotal, async function(amount, method, reference, party, info){
          await state.db.collection("sales").add({
            date: today, day: DAY_NAMES[end.getDay()], source: "board",
            amount: amount, paymentType: method, paymentReference: reference||"", party: (method==="credit" ? party : null),
            partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
            partyMembershipCode: (method==="credit" ? info.membershipCode : null),
            tableNumber: Number(id), sessionKey: sessionKey, startTime: table.data.startedAt, endTime: end.toISOString(),
            totalMinutes: Math.round(bill.totalMinutes), regularMinutes: Math.round(bill.regularMinutes),
            happyMinutes: Math.round(bill.happyMinutes), blocks: bill.blocks,
            hourlyRate: rates.hourlyRate, happyHourRate: rates.happyHourRate,
            enteredBy: enteredBy, createdAt: new Date().toISOString()
          });
          receiptPayments.push({label:"Table Time", amount:amount, method:method, reference:reference});
        });
      }

      if(cafPayment){
        // Route each payment line's rupees across cafeteria vs overage by share, so
        // "source" reporting (Board vs Cafeteria) stays accurate even when split.
        await writePaymentLines(cafPayment, cafSectionTotal, async function(amount, method, reference, party, info){
          var cafShare = cafBase > 0 ? (orderBill.total / cafBase) : 0;
          var cafPart = Math.round(amount * cafShare * 100) / 100;
          var overPart = Math.round((amount - cafPart) * 100) / 100;
          if(overageAmt === 0){ cafPart = amount; overPart = 0; }
          if(orderBill.total === 0){ overPart = amount; cafPart = 0; }

          if(cafPart > 0){
            await state.db.collection("sales").add({
              date: today, day: DAY_NAMES[end.getDay()], source: "cafeteria",
              amount: cafPart, paymentType: method, paymentReference: reference||"", party: (method==="credit" ? party : null),
              partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
              partyMembershipCode: (method==="credit" ? info.membershipCode : null),
              tableNumber: Number(id), sessionKey: sessionKey, items: (overPart===0 ? orderBill.lines : undefined), taxAmount: orderBill.tax,
              membershipCode: member ? member.data.code : null, memberName: member ? member.data.name : null,
              enteredBy: enteredBy, createdAt: new Date().toISOString()
            });
          }
          if(overPart > 0){
            await state.db.collection("sales").add({
              date: today, day: DAY_NAMES[end.getDay()], source: "board",
              amount: overPart, paymentType: method, paymentReference: reference||"", party: (method==="credit" ? party : null),
              partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
              partyMembershipCode: (method==="credit" ? info.membershipCode : null),
              tableNumber: Number(id), sessionKey: sessionKey, startTime: table.data.startedAt, endTime: end.toISOString(),
              totalMinutes: overage.overageMinutes, regularMinutes: overage.regularMinutes, happyMinutes: overage.happyMinutes,
              blocks: overage.blocks, hourlyRate: rates.hourlyRate, happyHourRate: rates.happyHourRate,
              membershipCode: member.data.code, memberName: member.data.name, note: "Overage beyond membership balance",
              enteredBy: enteredBy, createdAt: new Date().toISOString()
            });
          }
          receiptPayments.push({label: usingMember ? "Cafeteria + Overage" : "Cafeteria", amount:amount, method:method, reference:reference});
        });
      }

      await state.db.collection("tableSessions").add({
        tableNumber: Number(id), sessionKey: sessionKey, startTime: table.data.startedAt, endTime: end.toISOString(),
        totalMinutes: Math.round(bill.totalMinutes), actualMinutes: Math.round(bill.actualMinutes),
        regularMinutes: Math.round(bill.regularMinutes), happyMinutes: Math.round(bill.happyMinutes), blocks: bill.blocks,
        hourlyRate: rates.hourlyRate, happyHourRate: rates.happyHourRate,
        tableAmount: usingMember ? 0 : timeSectionTotal, tableAmountBeforeDiscount: usingMember ? 0 : bill.amount,
        overageAmount: overageAmt, overageMinutes: overage ? overage.overageMinutes : 0,
        cafeteriaAmount: orderBill.total, cafeteriaTax: orderBill.tax, cafeteriaItems: orderBill.lines,
        discountAmount: discount, discountReason: table.data.approvedDiscount ? (table.data.approvedDiscount.reason||"") : "",

  // Builds the manual entry's start/end Date objects from the form, handling
  // an overnight session (end time earlier than start = next day).
  function mb2ReadTimes(){
    var table = document.getElementById("mb2_table").value;
    var date = document.getElementById("mb2_date").value;
    var startTime = document.getElementById("mb2_startTime").value;
    var endTime = document.getElementById("mb2_endTime").value;
    if(!date || !startTime || !endTime) return null;
    var start = new Date(date+"T"+startTime+":00");
    var end = new Date(date+"T"+endTime+":00");
    if(end <= start) end = new Date(end.getTime() + 24*60*60*1000); // overnight session
    return {table: table, start: start, end: end};
  }
  // Same billing engine as live checkout (15-min blocks, happy-hour split,
  // per-table rate overrides) — a manual entry must price identically to a
  // real one for the same table and times.
  function mb2ComputeBill(){
    var times = mb2ReadTimes();
    if(!times || !mb2RatesConfig) return {amount:0, totalMinutes:0, actualMinutes:0};
    var rates = getEffectiveTableRate(times.table, mb2RatesConfig);
    var bill = computeSessionBill(times.start, times.end, rates);
    bill.rates = rates; bill.start = times.start; bill.end = times.end; bill.table = times.table;
    return bill;
  }
  function mb2Recompute(){
    var durEl = document.getElementById("mb2_duration");
    var amtEl = document.getElementById("mb2_amount");
    if(!durEl || !amtEl) return;
    var times = mb2ReadTimes();
    if(!times || !mb2RatesConfig){
      durEl.textContent = "—"; amtEl.textContent = "₹0";
      return;
    }
    var bill = mb2ComputeBill();
    durEl.textContent = fmtDuration(bill.actualMinutes*60000) + " (billed "+(bill.totalMinutes/60).toFixed(1)+"h)";
    amtEl.textContent = fmtMoney(bill.amount);
  }

  function addToDirectSaleCart(menuItemId){
    var menuItem = (state.posMenuItems||[]).filter(function(m){ return m.id === menuItemId; })[0];
    if(!menuItem) return;
    var existing = directSaleCart.filter(function(l){ return l.menuItemId === menuItemId; })[0];
    var currentQtyInCart = existing ? existing.qty : 0;
    if(menuItem.data.trackStock && currentQtyInCart + 1 > (menuItem.data.stockQty||0)){
      toast("Only "+(menuItem.data.stockQty||0)+" left in stock");
      return;
    }
    if(existing){
      existing.qty += 1;
      existing.amount = Math.round(existing.qty*existing.rate*100)/100;
    } else {
      directSaleCart.push({menuItemId:menuItemId, name:menuItem.data.name, qty:1, rate:menuItem.data.price, taxPercent:menuItem.data.taxPercent||0, amount:menuItem.data.price});
    }
    renderFdMenuCart();
  }

  function changeDirectSaleQty(idx, delta){
    var line = directSaleCart[idx];
    if(!line) return;
    if(delta > 0){
      var menuItem = (state.posMenuItems||[]).filter(function(m){ return m.id === line.menuItemId; })[0];
      if(menuItem && menuItem.data.trackStock && line.qty + 1 > (menuItem.data.stockQty||0)){
        toast("Only "+(menuItem.data.stockQty||0)+" left in stock");
        return;
      }
    }
    var newQty = Math.max(1, line.qty + delta);
    line.qty = newQty;
    line.amount = Math.round(line.qty*line.rate*100)/100;
    renderFdMenuCart();
  }

  async function completeDirectSale(){

    if(!payment) return;

    btn.disabled = true;

    var date = now.getFullYear()+"-"+pad2(now.getMonth()+1)+"-"+pad2(now.getDate());
    var dow = DAY_NAMES[now.getDay()];
    var enteredBy = state.staffLabel || (state.role === "admin" ? "Admin" : "");

          date: date, day: dow, source: "cafeteria", amount: lineAmount,

      });

  async function addSaleEntry(){
    var times = mb2ReadTimes();
    if(!times){ toast("Fill in date, start time and end time"); return; }
    if(!mb2RatesConfig){ toast("Rates still loading — try again in a moment"); return; }

    var table = times.table;
    var bill = mb2ComputeBill();
    var amount = bill.amount;
    if(!(amount > 0)){ toast("Computed amount must be greater than ₹0"); return; }

    var payment = readPaymentSection("mb2_pay", amount);
    if(!payment) return;

    var date = document.getElementById("mb2_date").value;
    var dow = DAY_NAMES[new Date(date+"T00:00:00").getDay()];
    var enteredBy = state.staffLabel || (state.role === "admin" ? "Admin" : "");
    // Same sessionKey convention as a live checkout, so this manual entry is
    // fully compatible with Table Usage reporting and deletion-reversal —
    // deleting its sale later correctly removes the linked session too.
    var sessionKey = "T"+table+"_"+times.start.toISOString();

    var btn = document.getElementById("mb2_addBtn");
    btn.disabled = true;
    try{
      await writePaymentLines(payment, amount, async function(lineAmount, method, reference, party, info){
        await state.db.collection("sales").add({
          date: date, day: dow, source: "board", amount: lineAmount,
          paymentType: method, paymentReference: reference||"", party: (method==="credit" ? party : null),
          partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
          partyMembershipCode: (method==="credit" ? info.membershipCode : null),
          tableNumber: Number(table), sessionKey: sessionKey, startTime: times.start.toISOString(), endTime: times.end.toISOString(),
          totalMinutes: bill.totalMinutes, regularMinutes: bill.regularMinutes, happyMinutes: bill.happyMinutes, blocks: bill.blocks,
          hourlyRate: bill.rates.hourlyRate, happyHourRate: bill.rates.happyHourRate,
          manualEntry: true, enteredBy: enteredBy, createdAt: new Date().toISOString()
        });
      });
      await state.db.collection("tableSessions").add({
        tableNumber: Number(table), sessionKey: sessionKey, startTime: times.start.toISOString(), endTime: times.end.toISOString(),
        totalMinutes: bill.totalMinutes, actualMinutes: Math.round(bill.actualMinutes),
        regularMinutes: bill.regularMinutes, happyMinutes: bill.happyMinutes, blocks: bill.blocks,
        hourlyRate: bill.rates.hourlyRate, happyHourRate: bill.rates.happyHourRate,
        tableAmount: amount, overageAmount: 0, cafeteriaAmount: 0, amount: amount,
        usingMember: false, manualEntry: true,
        date: date, enteredBy: enteredBy, createdAt: new Date().toISOString()
      });
      document.getElementById("mb2_startTime").value = "";
      document.getElementById("mb2_endTime").value = "";
      mb2Recompute();
      toast("Table "+table+" entry added: "+fmtMoney(amount));
    }catch(e){
      toast("Couldn't save: " + (e && e.code ? e.code : "error"));
    }
    btn.disabled = false;
  }

  function subscribePosList(){
    cleanupUnsub();
    state.unsub = [];
    state.posCache = null;
    var start, end;
    if(state.role === "staff"){
      var now = new Date();
      var todayStr = now.getFullYear()+"-"+pad2(now.getMonth()+1)+"-"+pad2(now.getDate());
      start = todayStr;
      end = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
      end = end.getFullYear()+"-"+pad2(end.getMonth()+1)+"-"+pad2(end.getDate());
    } else {
      start = monthStartDate(state.monthIdx);
      end = monthEndDateExclusive(state.monthIdx);
    }
    var q = state.db.collection("sales").where("date", ">=", start).where("date", "<", end).orderBy("date","asc");
    state.unsub.push(q.onSnapshot(function(snap){
      state.posCache = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderPosList();
    }, function(){
      document.getElementById("listWrap").innerHTML = '<div class="empty">Error loading data</div>';
    }));
  }

  var editingSaleId = null;

  function renderPosList(){
    var wrap = document.getElementById("listWrap");
    if(!wrap || state.posCache === null) return;
    var docs = state.posCache;

    var totalSales = 0, totalCollected = 0, totalCredit = 0;
    docs.forEach(function(item){
      var d = item.data;
      var amt = Number(d.amount)||0;
      totalSales += amt;
      if(isCreditEntry(d)) totalCredit += amt; else totalCollected += amt;
    });
    document.getElementById("totalSales").textContent = fmtMoney(totalSales);
    document.getElementById("totalCash").textContent = fmtMoney(totalCollected);
    document.getElementById("totalCredit").textContent = fmtMoney(totalCredit);

    var filtered = docs;
    if(posFilter !== "all") filtered = docs.filter(function(item){
      var m = item.data.paymentType;
      if(posFilter === "card") return m === "credit_card" || m === "debit_card";
      return m === posFilter;
    });

    if(filtered.length === 0){
      wrap.innerHTML = '<div class="empty">No sales match this filter.</div>';
      return;
    }
    var methodOptions = PAYMENT_METHODS.map(function(m){ return '<option value="'+m.key+'">'+m.label+'</option>'; }).join("");

    var html = '<div class="list">';
    filtered.forEach(function(item){
      var data = item.data;

      if(editingSaleId === item.id){
        html += '<div class="row" style="display:block; padding:12px 8px;">' +
          '<div class="field-row">' +
            '<div><label>Date</label><input type="date" id="pe_date" value="'+data.date+'"></div>' +
            '<div><label>Source</label><select id="pe_source"><option value="board"'+(data.source!=="cafeteria"?' selected':'')+'>Board</option><option value="cafeteria"'+(data.source==="cafeteria"?' selected':'')+'>Cafeteria</option></select></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div><label>Amount (₹)</label><input type="number" step="0.01" id="pe_amount" value="'+data.amount+'"></div>' +
            '<div><label>Method</label><select id="pe_method">'+methodOptions+'</select></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div id="pe_refRow" style="display:none;"><label>Reference</label><input type="text" id="pe_ref" value="'+escapeHtml(data.paymentReference||"")+'"></div>' +
            '<div id="pe_partyRow" style="display:none;"><label>Customer</label><select id="pe_party" data-role="customer-party">'+customerOptionsHtml()+'</select></div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button class="btn-ghost" style="border:1px solid var(--border); margin-right:8px;" data-cancel-sale-edit="1">Cancel</button>' +
            '<button class="btn-primary" data-save-sale="'+item.id+'">Save</button>' +
          '</div>' +
        '</div>';
        return;
      }

      var credit = isCreditEntry(data);
      var payColor = paymentBadgeColor(data.paymentType);
      var isTableBill = data.tableNumber !== undefined && data.tableNumber !== null;
      var sourceLabel;
      if(data.source === "membership"){
        sourceLabel = "Membership"+(data.membershipCode ? " · "+data.membershipCode : "");
      } else if(data.source === "ps5"){
        sourceLabel = 'PS5 #'+data.ps5Number+(data.customerName ? ' · '+escapeHtml(data.customerName) : '')+(data.startTime && data.endTime ? ' · '+fmtClock(data.startTime)+'–'+fmtClock(data.endTime) : '');
      } else if(isTableBill && data.source === "cafeteria"){
        sourceLabel = "Table "+data.tableNumber+" · Cafeteria"+(data.items && data.items.length ? " ("+data.items.length+" item"+(data.items.length>1?"s":"")+")" : "");
      } else if(isTableBill){
        sourceLabel = 'Table '+data.tableNumber+(data.startTime && data.endTime ? ' · '+fmtClock(data.startTime)+'–'+fmtClock(data.endTime) : '')+(data.totalMinutes ? ' ('+data.totalMinutes+' min)' : '');
      } else if(data.source === "cafeteria" && data.saleType === "direct"){
        sourceLabel = "Direct Sale"+(data.items && data.items.length ? " ("+data.items.length+" item"+(data.items.length>1?"s":"")+")" : "");
      } else {
        sourceLabel = (data.source === "cafeteria" ? "Cafeteria" : "Board");
      }
      var refNote = data.paymentReference ? ' · ref '+escapeHtml(data.paymentReference) : '';
      var enteredByNote = (state.role === "admin" && data.enteredBy) ? ' · by '+escapeHtml(data.enteredBy) : '';
      html += '<div class="row">' +
        '<div class="main"><div class="t1">'+fmtDateShort(data.date)+' <span style="color:var(--muted);font-weight:400;">('+data.day+')</span> ' +
          '<span class="badge" style="--chip:'+payColor+'">'+paymentMethodLabel(data.paymentType)+'</span></div>' +
        '<div class="t2">'+sourceLabel+(credit && data.party ? ' · '+escapeHtml(data.party) : '')+refNote+enteredByNote+'</div></div>' +
        '<div class="amt" style="color:'+payColor+'">'+fmtMoney(data.amount)+'</div>' +
        (state.role === "admin" ? (
          '<button class="btn-ghost" style="border:1px solid var(--border); font-size:12px; padding:5px 9px;" data-edit-sale="'+item.id+'">Edit</button>' +
          '<button class="btn-danger" data-id="'+item.id+'" style="margin-left:6px;">Delete</button>'
        ) : '') +
      '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll("button[data-edit-sale]").forEach(function(btn){
      btn.addEventListener("click", function(){
        editingSaleId = btn.getAttribute("data-edit-sale");
        renderPosList();
      });
    });
    wrap.querySelectorAll("button[data-cancel-sale-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        editingSaleId = null;
        renderPosList();
      });
    });
    var methodSel = document.getElementById("pe_method");
    if(methodSel){
      var editingItem = filtered.filter(function(x){ return x.id === editingSaleId; })[0];
      if(editingItem) methodSel.value = editingItem.data.paymentType || "cash";
      var partySel = document.getElementById("pe_party");
      if(partySel && editingItem && editingItem.data.partyCustomerId) partySel.value = editingItem.data.partyCustomerId;
      function refreshEditRows(){
        document.getElementById("pe_refRow").style.display = needsReference(methodSel.value) ? "" : "none";
        document.getElementById("pe_partyRow").style.display = (methodSel.value === "credit") ? "" : "none";
      }
      methodSel.addEventListener("change", refreshEditRows);
      refreshEditRows();
    }
    wrap.querySelectorAll("button[data-save-sale]").forEach(function(btn){
      btn.addEventListener("click", function(){ saveSaleEdit(btn.getAttribute("data-save-sale")); });
    });
    wrap.querySelectorAll("button[data-id]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      armDeleteButton(btn, function(){
        deleteWithAudit("sales", id, {
          entryType: "Sale",
          reverseInventory: reverseSaleEffects,
          describe: describeSaleForAudit,
          getAmount: function(d){ return d.amount; },
          getTableNumber: function(d){ return (d.tableNumber !== undefined && d.tableNumber !== null) ? d.tableNumber : d.ps5Number; },
          getPaymentMethod: function(d){ return d.paymentType; }
        }).then(function(ok){
          if(ok) toast("Deleted");
          else { toast("Couldn't delete"); btn.disabled = false; disarmDeleteButton(btn); }
        });
      });
    });
  }

  async function saveSaleEdit(id){
    var date = document.getElementById("pe_date").value;
    var source = document.getElementById("pe_source").value;
    var amount = parseFloat(document.getElementById("pe_amount").value);
    var method = document.getElementById("pe_method").value;
    var reference = needsReference(method) ? (document.getElementById("pe_ref").value||"").trim() : "";
    var custId = method === "credit" ? document.getElementById("pe_party").value : "";

    if(!date){ toast("Pick a date"); return; }
    if(isNaN(amount) || amount <= 0){ toast("Enter a valid amount"); return; }
    if(method === "credit" && !custId){ toast("Select a registered customer for credit"); return; }

    var info = custId ? resolveCustomerInfo(custId) : null;

    var btn = document.querySelector('button[data-save-sale="'+id+'"]');
    if(btn) btn.disabled = true;
    try{
      await state.db.collection("sales").doc(id).update({
        date: date, day: DAY_NAMES[new Date(date+"T00:00:00").getDay()], source: source, amount: amount,
        paymentType: method, paymentReference: reference,
        party: (method==="credit" && info ? info.name : null),
        partyCustomerId: (method==="credit" && info ? info.customerId : null),
        partyCustomerMobile: (method==="credit" && info ? info.mobile : null),
        partyMembershipCode: (method==="credit" && info ? info.membershipCode : null)
      });
      editingSaleId = null;
      toast("Sale updated");
    }catch(e){
      toast("Couldn't save changes");
      if(btn) btn.disabled = false;
    }
  }

  // A sale counts as "credit" if paymentType is credit; supports legacy day-wise docs (no paymentType) as cash.
  function isCreditEntry(d){ return d.paymentType === "credit"; }
  function paymentBadgeColor(method){
    if(method === "credit") return "#b45309";
    if(method === "upi") return "#0369a1";
    if(method === "credit_card" || method === "debit_card") return "#4338ca";
    return "#15803d"; // cash (and legacy undefined)
  }

  function refreshPosPartyDatalist(){

    dl.innerHTML = Object.keys(names).sort().map(function(n){ return '<option value="'+escapeHtml(n)+'">'; }).join("");
  }

  async function addOpeningBalance(){
    var date = document.getElementById("o_date").value;
    var party = (document.getElementById("o_party").value || "").trim();
    var amount = parseFloat(document.getElementById("o_amount").value);

    if(!party){ toast("Party name is required"); return; }

    var body = {date: date, party: party, amount: amount, note: note || "Opening balance", createdAt: new Date().toISOString()};

    var btn = document.getElementById("addOpeningBtn");
    btn.disabled = true;

      await state.db.collection("creditOpening").add(body);
      document.getElementById("o_amount").value = "";
      document.getElementById("o_note").value = "";
      toast("Opening balance added for " + party);

      toast("Couldn't save: " + (e && e.code ? e.code : "error"));

  function subscribeCreditData(){
    cleanupUnsub();
    state.unsub = [];
    state.creditGivenAll = null;    // lifetime credit SALES (sales collection, paymentType=credit), for balances + datalist
    state.creditOpeningAll = null;  // lifetime opening balances (previous dues)
    state.creditPaymentsAll = null; // lifetime due payments
    state.creditGivenMonth = null;  // this month's credit sales, for transactions list
    state.creditOpeningMonth = null;
    state.creditPaymentsMonth = null;

    var mStart = monthStartDate(state.monthIdx);
    var mEnd = monthEndDateExclusive(state.monthIdx);

    // Balances are lifetime — a debt doesn't reset when you change the year selector.
    state.unsub.push(state.db.collection("sales").where("paymentType","==","credit").onSnapshot(function(snap){
      state.creditGivenAll = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderPartyBalances();
      renderPartyDatalist();
    }, function(){ state.creditGivenAll = []; renderPartyBalances(); }));

    state.unsub.push(state.db.collection("creditOpening").onSnapshot(function(snap){
      state.creditOpeningAll = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderPartyBalances();
      renderPartyDatalist();
    }, function(){ state.creditOpeningAll = []; renderPartyBalances(); }));

    state.unsub.push(state.db.collection("creditPayments").onSnapshot(function(snap){
      state.creditPaymentsAll = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderPartyBalances();
      renderPartyDatalist();
    }, function(){ state.creditPaymentsAll = []; renderPartyBalances(); }));

    state.unsub.push(state.db.collection("sales").where("paymentType","==","credit").where("date",">=",mStart).where("date","<",mEnd).orderBy("date","asc").onSnapshot(function(snap){
      state.creditGivenMonth = snap.docs.map(function(d){ return {id:d.id, type:"given", data:d.data()}; });
      renderCreditTxnList();
    }, function(){ state.creditGivenMonth = []; renderCreditTxnList(); }));

    state.unsub.push(state.db.collection("creditOpening").where("date",">=",mStart).where("date","<",mEnd).orderBy("date","asc").onSnapshot(function(snap){
      state.creditOpeningMonth = snap.docs.map(function(d){ return {id:d.id, type:"opening", data:d.data()}; });
      renderCreditTxnList();
    }, function(){ state.creditOpeningMonth = []; renderCreditTxnList(); }));

    state.unsub.push(state.db.collection("creditPayments").where("date",">=",mStart).where("date","<",mEnd).orderBy("date","asc").onSnapshot(function(snap){
      state.creditPaymentsMonth = snap.docs.map(function(d){ return {id:d.id, type:"payment", data:d.data()}; });
      renderCreditTxnList();
    }, function(){ state.creditPaymentsMonth = []; renderCreditTxnList(); }));
  }

  function renderPartyDatalist(){
    var names = {};
    if(state.creditGivenAll) state.creditGivenAll.forEach(function(x){ if(x.data.party) names[x.data.party] = true; });
    if(state.creditOpeningAll) state.creditOpeningAll.forEach(function(x){ if(x.data.party) names[x.data.party] = true; });
    if(state.creditPaymentsAll) state.creditPaymentsAll.forEach(function(x){ if(x.data.party) names[x.data.party] = true; });
    var optsHtml = Object.keys(names).sort().map(function(n){ return '<option value="'+escapeHtml(n)+'">'; }).join("");
    var dl2 = document.getElementById("partyList2");
