<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RS POS">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%23146c3a'/%3E%3Ctext x='90' y='118' font-size='96' text-anchor='middle'%3E%F0%9F%8E%B1%3C/text%3E%3C/svg%3E">
<title>RS Sales &amp; Expense Manager</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
    --border:#e3e6ea; --accent:#1f6feb; --accent-ink:#ffffff;
    --sales:#1f9d55; --exp:#d64545; --pl-pos:#1f9d55; --pl-neg:#d64545;
    --row-alt:#fafbfc; --shadow:0 1px 3px rgba(0,0,0,.06);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1c1f26; --text:#e7e9ee; --muted:#9aa2af;
      --border:#2c313b; --accent:#4c8dff; --accent-ink:#0b1220;
      --row-alt:#20242c; --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1c1f26; --text:#e7e9ee; --muted:#9aa2af;
    --border:#2c313b; --accent:#4c8dff; --accent-ink:#0b1220;
    --row-alt:#20242c; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    background:var(--card); border-bottom:1px solid var(--border);
  }
  header h1{margin:0; font-size:16px; letter-spacing:.2px;}
  header .sub{margin:2px 0 0; font-size:12px; color:var(--muted);}
  .toprow{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  select, input, button, textarea{
    font-family:inherit; font-size:14px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); padding:8px 10px;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  .btn-primary:disabled{opacity:.5;}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--pl-neg); border-color:var(--pl-neg); background:transparent; padding:5px 9px; font-size:12px;}
  nav.tabs{
    display:flex; gap:4px; overflow-x:auto; padding:10px 12px 0;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto; background:transparent; border:1px solid transparent;
    color:var(--muted); font-weight:600; padding:8px 12px; border-radius:20px; font-size:13px;
    white-space:nowrap;
  }
  nav.tabs button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  main{padding:14px 12px 40px; max-width:760px; margin:0 auto;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card h2{margin:0 0 10px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .field-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .field-row > div{flex:1 1 120px; min-width:0;}
  label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px;}
  select, input, textarea{width:100%;}
  .form-actions{display:flex; justify-content:flex-end; margin-top:4px;}
  .list{border-top:1px solid var(--border); margin-top:10px;}
  .row{
    display:flex; align-items:center; gap:8px; padding:10px 2px;
    border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .row:nth-child(even){background:var(--row-alt);}
  .row .main{flex:1; min-width:0;}
  .row .main .t1{font-weight:600;}
  .row .main .t2{color:var(--muted); font-size:12px;}
  .row .amt{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;}
  .empty{padding:22px 4px; text-align:center; color:var(--muted); font-size:13px;}
  .totals-bar{
    display:flex; justify-content:space-between; padding:10px 2px 2px; font-size:13.5px; font-weight:700;
  }
  table.summary{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.summary th, table.summary td{
    padding:7px 6px; text-align:right; border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  table.summary th:first-child, table.summary td:first-child{text-align:left; position:sticky; left:0; background:var(--card);}
  table.summary thead th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;}
  table.summary tfoot td{font-weight:700; border-top:2px solid var(--border); border-bottom:none;}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .pl-pos{color:var(--pl-pos);} .pl-neg{color:var(--pl-neg);}
  .hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .chiprow{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid var(--border); background:transparent; color:var(--muted);
    font-size:12px; font-weight:600; padding:6px 11px; border-radius:14px; white-space:nowrap;
  }
  .chip[style*="--chip"]{border-color:var(--chip); color:var(--chip);}
  .chip.active{background:var(--chip, var(--accent)); color:#fff; border-color:var(--chip, var(--accent));}
  .badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.2px; text-transform:uppercase;
    color:#fff; background:var(--chip, var(--muted)); padding:2px 6px; border-radius:8px; vertical-align:middle;
  }
  .savebar{position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; pointer-events:none;}
  .toast{
    pointer-events:auto; background:var(--text); color:var(--bg); padding:8px 14px; border-radius:20px;
    font-size:12.5px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.2s;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .status{font-size:11px; color:var(--muted); text-align:center; margin-top:2px;}

  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; padding:0; }
    #printArea table{ width:100%; border-collapse:collapse; }
    #printArea th, #printArea td{ padding:4px 6px; border-bottom:1px solid #ccc; text-align:left; }
    #printArea .pr-total{ font-weight:700; font-size:15px; border-top:2px solid #000; padding-top:6px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎱 RANU SNOOKER PREMIUM CLUB</h1>
  <p class="sub" id="headerSub">Sales &amp; Expense Manager</p>
  <div class="toprow">
    <div style="flex:0 0 110px;">
      <select id="yearSelect"></select>
    </div>
    <div style="flex:1;">
      <select id="monthSelect"></select>
    </div>
    <button id="logoutBtn" class="btn-ghost" style="border:1px solid var(--border); display:none; flex:0 0 auto;">Logout</button>
  </div>
</header>

<div id="writeAccessBanner" style="display:none; background:#7c2d12; color:#fff; font-size:12.5px; padding:8px 14px; text-align:center;"></div>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<div class="savebar"><div class="toast" id="toast"></div></div>
<div id="printArea"></div>

<script>
(function(){
  "use strict";

  // ---------- constants ----------
  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var YEAR_RANGE_PAST = 6;   // how many past years to offer
  var YEAR_RANGE_FUTURE = 4; // how many upcoming years to offer

  var EXP_CATS = [
    {key:"grocery", label:"Grocery",  nameField:"item",  nameLabel:"Item",        placeholder:"e.g. Cool drinks",        color:"#c2410c"},
    {key:"general", label:"General",  nameField:"item",  nameLabel:"Item",        placeholder:"e.g. Electricity bill",   color:"#0369a1"},
    {key:"police",  label:"Police",   nameField:"name",  nameLabel:"Paid to",     placeholder:"e.g. Praksh car",         color:"#4338ca"},
    {key:"salary",  label:"Salary",   nameField:"name",  nameLabel:"Staff name",  placeholder:"e.g. Zaid",               color:"#0f766e"},
    {key:"charity", label:"Charity",  nameField:"note",  nameLabel:"Note (optional)", placeholder:"e.g. Monthly donation", color:"#a21caf"}
  ];
  function catByKey(key){
    for(var i=0;i<EXP_CATS.length;i++){ if(EXP_CATS[i].key===key) return EXP_CATS[i]; }
    return EXP_CATS[0];
  }

  var state = {
    year: new Date().getFullYear(),
    monthIdx: new Date().getMonth(),
    tab: "dashboard",
    db: null,
    userNS: null,
    canWrite: true,
    role: null,            // "admin" | "staff" | null (not logged in)
    staffLabel: "",        // display name for the logged-in staff/admin
    tablesTimerHandle: null, // interval for live table timers
    statementUnsub: null,    // active subscription for an open member hours statement
    unsub: null,          // active list subscription for current tab
    unsubSummary: [],     // subscriptions for summary tab
    unsubOutstanding: [], // subscriptions for outstanding report tab
    cache: {}             // cache[collection] = array of docs (for summary)
  };

  function cleanupUnsub(){
    if(!state.unsub) return;
    if(typeof state.unsub === "function"){ state.unsub(); }
    else if(Array.isArray(state.unsub)){ state.unsub.forEach(function(u){ u(); }); }
    state.unsub = null;
  }

  function pad2(n){ return (n<10?"0":"")+n; }
  function monthKey(idx){ return state.year + "-" + pad2(idx+1); }
  function monthStartDate(idx){ return state.year + "-" + pad2(idx+1) + "-01"; }
  function monthEndDateExclusive(idx){
    if(idx === 11) return (state.year+1) + "-01-01";
    return state.year + "-" + pad2(idx+2) + "-01";
  }
  function fmtMoney(n){
    n = Number(n)||0;
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toLocaleString("en-IN", {maximumFractionDigits:2});
    return (neg?"(":"") + "₹" + s + (neg?")":"");
  }
  function fmtDateShort(d){
    var parts = d.split("-");
    return parts[2] + " " + MONTHS[parseInt(parts[1],10)-1];
  }
  function fmtDateFull(d){
    var parts = d.split("-");
    return parts[2] + " " + MONTHS[parseInt(parts[1],10)-1] + " " + parts[0];
  }
  function fmtClock(iso){
    if(!iso) return "";
    var d = new Date(iso);
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if(h === 0) h = 12;
    return h + ":" + pad2(m) + " " + ampm;
  }

  // ---------- print ----------
  function printHtml(bodyHtml){
    var area = document.getElementById("printArea");
    if(!area) return;
    area.innerHTML = '<div style="font-family:-apple-system,Arial,sans-serif; color:#111; max-width:420px; margin:0 auto;">' +
      '<div style="text-align:center; margin-bottom:10px;"><div style="font-size:18px; font-weight:700;">🎱 RANU SNOOKER PREMIUM CLUB</div></div>' +
      bodyHtml +
    '</div>';
    setTimeout(function(){ window.print(); }, 50);
  }

  // ---------- shared payment methods (cash / UPI / cards / credit) ----------
  var PAYMENT_METHODS = [
    {key:"cash", label:"Cash"},
    {key:"upi", label:"UPI"},
    {key:"credit_card", label:"Credit Card"},
    {key:"debit_card", label:"Debit Card"},
    {key:"credit", label:"Credit (Due)"}
  ];
  function paymentMethodLabel(key){
    var m = PAYMENT_METHODS.filter(function(p){ return p.key === key; })[0];
    return m ? m.label : (key || "");
  }
  function needsReference(method){ return method === "upi" || method === "credit_card" || method === "debit_card"; }

  // Credit (Due) must always point at a real registered customer — never
  // free-typed. This renders the shared customer dropdown options, and looks
  // up a customer's name/mobile/active-membership-code for the sales record.
  function customerOptionsHtml(){
    return '<option value="">— Select registered customer —</option>' + (state.customersCache||[]).map(function(c){
      var mobile = c.data.whatsappDisplay || c.data.whatsapp || "";
      return '<option value="'+c.id+'">'+escapeHtml(c.data.name)+(mobile ? ' ('+mobile+')' : '')+'</option>';
    }).join("");
  }
  function refreshCustomerSelects(){
    document.querySelectorAll('select[data-role="customer-party"]').forEach(function(sel){
      var current = sel.value;
      sel.innerHTML = customerOptionsHtml();
      if(current) sel.value = current;
    });
  }
  function resolveCustomerInfo(customerId){
    var c = (state.customersCache||[]).filter(function(x){ return x.id === customerId; })[0];
    if(!c) return null;
    var today = (function(){ var n=new Date(); return n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-"+pad2(n.getDate()); })();
    var membership = (state.membershipsCache||[]).filter(function(m){
      return m.data.customerId === customerId && m.data.expiryDate >= today && !m.data.cancelled;
    })[0];
    return {
      customerId: customerId, name: c.data.name,
      mobile: c.data.whatsappDisplay || c.data.whatsapp || "",
      membershipCode: membership ? membership.data.code : null
    };
  }

  // A reusable "how was this paid" block: single method (+ optional reference,
  // or a registered-customer pick if Credit) with an opt-in split across up to
  // 3 methods. Used by Table checkout, Membership purchase, POS, and anywhere
  // else a bill is settled. `prefix` namespaces the element ids so several can
  // exist on one screen (e.g. table-time payment + cafeteria payment).
  function renderPaymentSectionHtml(prefix, partyListId, label){
    var methodOptions = PAYMENT_METHODS.map(function(m){ return '<option value="'+m.key+'">'+m.label+'</option>'; }).join("");
    var splitRows = "";
    for(var i=0;i<3;i++){
      splitRows += '<tr>' +
        '<td><select id="'+prefix+'_s_method_'+i+'" style="width:100%;">'+ '<option value="">—</option>' + methodOptions+'</select></td>' +
        '<td><input type="number" id="'+prefix+'_s_amount_'+i+'" placeholder="0" step="0.01" style="width:80px;"></td>' +
        '<td>' +
          '<input type="text" id="'+prefix+'_s_ref_'+i+'" placeholder="ref no." style="width:100%;">' +
          '<select id="'+prefix+'_s_party_'+i+'" data-role="customer-party" style="display:none; width:100%;">'+customerOptionsHtml()+'</select>' +
        '</td>' +
      '</tr>';
    }
    return '<h2 style="font-size:13px; margin-top:14px;">'+(label||"Payment")+'</h2>' +
      '<div class="field-row" id="'+prefix+'_methodRow">' +
        '<div><label>Method</label><select id="'+prefix+'_method">'+methodOptions+'</select></div>' +
        '<div id="'+prefix+'_refRow" style="display:none;"><label>Reference / Txn No. (optional)</label><input type="text" id="'+prefix+'_ref" placeholder="e.g. UPI ref"></div>' +
      '</div>' +
      '<div class="field-row" id="'+prefix+'_partyRow" style="display:none;"><div style="flex:1 1 100%"><label>Customer</label><select id="'+prefix+'_party" data-role="customer-party">'+customerOptionsHtml()+'</select></div></div>' +
      '<div class="field-row"><div style="flex:1 1 100%;"><label style="display:flex; align-items:center; gap:6px; font-weight:400; text-transform:none;">' +
        '<input type="checkbox" id="'+prefix+'_splitToggle" style="width:auto;"> Split across multiple payment methods' +
      '</label></div></div>' +
      '<div id="'+prefix+'_splitWrap" style="display:none;">' +
        '<div class="scrollx"><table class="summary" style="min-width:380px;"><thead><tr><th style="text-align:left;">Method</th><th>Amount</th><th style="text-align:left;">Reference / Customer</th></tr></thead>' +
        '<tbody>'+splitRows+'</tbody></table></div>' +
        '<div class="hint" id="'+prefix+'_splitStatus'+'"></div>' +
      '</div>';
  }

  function wirePaymentSection(prefix, getTotal, onChange){
    var methodSel = document.getElementById(prefix+"_method");
    if(!methodSel) return;
    function refreshSingle(){
      document.getElementById(prefix+"_refRow").style.display = needsReference(methodSel.value) ? "" : "none";
      document.getElementById(prefix+"_partyRow").style.display = (methodSel.value === "credit") ? "" : "none";
    }
    methodSel.addEventListener("change", function(){ refreshSingle(); if(onChange) onChange(); });
    refreshSingle();

    var splitToggle = document.getElementById(prefix+"_splitToggle");
    function refreshSplitVisibility(){
      var on = splitToggle.checked;
      document.getElementById(prefix+"_splitWrap").style.display = on ? "" : "none";
      document.getElementById(prefix+"_methodRow").style.display = on ? "none" : "";
      document.getElementById(prefix+"_partyRow").style.display = on ? "none" : (methodSel.value === "credit" ? "" : "none");
      if(!on) refreshSingle();
      updateSplitStatus();
      if(onChange) onChange();
    }
    splitToggle.addEventListener("change", refreshSplitVisibility);

    function refreshSplitRow(i){
      var rowMethodSel = document.getElementById(prefix+"_s_method_"+i);
      var refEl = document.getElementById(prefix+"_s_ref_"+i);
      var partyEl = document.getElementById(prefix+"_s_party_"+i);
      var isCredit = rowMethodSel.value === "credit";
      refEl.style.display = isCredit ? "none" : "";
      partyEl.style.display = isCredit ? "" : "none";
    }

    function updateSplitStatus(){
      var total = getTotal();
      var allocated = 0;
      for(var i=0;i<3;i++){
        var amtEl = document.getElementById(prefix+"_s_amount_"+i);
        if(amtEl) allocated += parseFloat(amtEl.value)||0;
      }
      var statusEl = document.getElementById(prefix+"_splitStatus");
      if(!statusEl) return;
      var diff = Math.round((total-allocated)*100)/100;
      if(Math.abs(diff) < 0.01){ statusEl.textContent = "Fully allocated ✓ ("+fmtMoney(allocated)+" of "+fmtMoney(total)+")"; statusEl.style.color = "var(--pl-pos)"; }
      else if(diff > 0){ statusEl.textContent = fmtMoney(diff)+" left to allocate ("+fmtMoney(allocated)+" of "+fmtMoney(total)+")"; statusEl.style.color = "var(--pl-neg)"; }
      else { statusEl.textContent = "Over-allocated by "+fmtMoney(-diff)+" ("+fmtMoney(allocated)+" of "+fmtMoney(total)+")"; statusEl.style.color = "var(--pl-neg)"; }
    }
    for(var i=0;i<3;i++){
      (function(idx){
        var amtEl = document.getElementById(prefix+"_s_amount_"+idx);
        var rowMethodSel = document.getElementById(prefix+"_s_method_"+idx);
        if(amtEl) amtEl.addEventListener("input", function(){ updateSplitStatus(); if(onChange) onChange(); });
        if(rowMethodSel) rowMethodSel.addEventListener("change", function(){ refreshSplitRow(idx); if(onChange) onChange(); });
        refreshSplitRow(idx);
      })(i);
    }
    updateSplitStatus();
  }

  // Reads the payment section's current state. Returns null (with a toast
  // explaining why) if invalid. Credit always resolves to a real registered
  // customer (name/mobile/membershipCode), never free text.
  // Non-split: {split:false, method, reference, party, customerId, customerMobile, membershipCode}.
  // Split: {split:true, lines:[{method, amount, reference, party, customerId, customerMobile, membershipCode}]}.
  function readPaymentSection(prefix, totalAmount){
    var splitToggle = document.getElementById(prefix+"_splitToggle");
    if(splitToggle && splitToggle.checked){
      var lines = [];
      var allocated = 0;
      for(var i=0;i<3;i++){
        var method = document.getElementById(prefix+"_s_method_"+i).value;
        var amount = parseFloat(document.getElementById(prefix+"_s_amount_"+i).value) || 0;
        if(!method || amount <= 0) continue;
        var line = {method:method, amount:Math.round(amount*100)/100, reference:"", party:null, customerId:null, customerMobile:null, membershipCode:null};
        if(method === "credit"){
          var custId = document.getElementById(prefix+"_s_party_"+i).value;
          if(!custId){ toast("Select a registered customer for the credit line"); return null; }
          var info = resolveCustomerInfo(custId);
          line.party = info.name; line.customerId = info.customerId; line.customerMobile = info.mobile; line.membershipCode = info.membershipCode;
        } else if(needsReference(method)){
          line.reference = (document.getElementById(prefix+"_s_ref_"+i).value||"").trim();
        }
        lines.push(line);
        allocated += amount;
      }
      if(lines.length === 0){ toast("Add at least one payment line"); return null; }
      if(Math.abs(allocated - totalAmount) > 0.01){ toast("Split payments must add up to the total bill"); return null; }
      return {split:true, lines:lines};
    }
    var method = document.getElementById(prefix+"_method").value;
    var reference = needsReference(method) ? (document.getElementById(prefix+"_ref").value||"").trim() : "";
    var result = {split:false, method:method, reference:reference, party:null, customerId:null, customerMobile:null, membershipCode:null};
    if(method === "credit"){
      var custId2 = document.getElementById(prefix+"_party").value;
      if(!custId2){ toast("Select a registered customer for credit"); return null; }
      var info2 = resolveCustomerInfo(custId2);
      result.party = info2.name; result.customerId = info2.customerId; result.customerMobile = info2.mobile; result.membershipCode = info2.membershipCode;
    }
    return result;
  }

  function todayInMonth(idx){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
    if(y===state.year && m===idx) return state.year+"-"+pad2(m+1)+"-"+pad2(d);
    return monthStartDate(idx);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  // ---------- year + month select ----------
  function buildYearSelect(){
    var sel = document.getElementById("yearSelect");
    sel.innerHTML = "";
    var nowYear = new Date().getFullYear();
    var from = nowYear - YEAR_RANGE_PAST;
    var to = nowYear + YEAR_RANGE_FUTURE;
    // always include the currently selected year even if outside the default window
    if(state.year < from) from = state.year;
    if(state.year > to) to = state.year;
    for(var y=from; y<=to; y++){
      var opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y + (y===nowYear ? " (current)" : "");
      if(y === state.year) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener("change", function(){
      state.year = parseInt(sel.value,10);
      var sub = document.getElementById("headerSub");
      if(sub) sub.textContent = "Sales & Expense Manager — FY " + state.year;
      buildMonthSelect();
      renderTab();
    });
  }

  function buildMonthSelect(){
    var sel = document.getElementById("monthSelect");
    sel.innerHTML = "";
    for(var i=0;i<12;i++){
      var opt = document.createElement("option");
      opt.value = i;
      opt.textContent = MONTH_FULL[i] + " " + state.year;
      if(i === state.monthIdx) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.onchange = function(){
      state.monthIdx = parseInt(sel.value,10);
      renderTab();
    };
  }

  // ---------- tabs ----------
  var ALL_TABS = [
    {key:"dashboard", label:"Dashboard"},
    {key:"tables", label:"Tables"},
    {key:"ps5", label:"PS5"},
    {key:"shift", label:"Shift"},
    {key:"pos", label:"POS"},
    {key:"expenses", label:"Expenses"},
    {key:"credit", label:"Credit"},
    {key:"outstanding", label:"Outstanding"},
    {key:"customers", label:"Customers"},
    {key:"membership", label:"Membership"},
    {key:"inventory", label:"Inventory"},
    {key:"reports", label:"Reports"},
    {key:"summary", label:"Summary"}
  ];
  var STAFF_TABS = ["dashboard","tables","ps5","shift","pos","outstanding"];
  function visibleTabs(){
    if(state.role === "staff") return ALL_TABS.filter(function(t){ return STAFF_TABS.indexOf(t.key) !== -1; });
    return ALL_TABS;
  }
  function buildTabs(){
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    visibleTabs().forEach(function(t){
      var b = document.createElement("button");
      b.textContent = t.label;
      b.className = (t.key === state.tab) ? "active" : "";
      b.addEventListener("click", function(){
        state.tab = t.key;
        buildTabs();
        renderTab();
      });
      nav.appendChild(b);
    });
  }

  // ---------- db init ----------
  async function initDb(){
    try{
      state.db = await claude.use("db");
    }catch(e){ state.db = null; }
    try{
      var user = await claude.use("user");
      if(user && typeof user.can === "function"){
        state.canWrite = await user.can("data.write"); // true | false | null (unknown — don't preemptively block)
      } else {
        state.canWrite = true;
      }
    }catch(e){ state.canWrite = true; }
    if(!state.db){
      document.getElementById("main").innerHTML =
        '<div class="card"><h2>Storage unavailable</h2><p>This view can\'t reach the data store right now. Try reopening the artifact.</p></div>';
      return false;
    }
    return true;
  }

  // ---------- login / roles ----------
  var AUTH_DEFAULTS = {
    staff1Name:"Staff 1", staff1Passcode:"staff123",
    staff2Name:"Staff 2", staff2Passcode:"staff456",
    staff3Name:"Staff 3", staff3Passcode:"staff789",
    staff4Name:"Staff 4", staff4Passcode:"staff321",
    adminPasscode:"admin786"
  };
  var LOGIN_STORAGE_KEY = "rsRole";
  var LOGIN_LABEL_KEY = "rsStaffLabel";

  async function getAuthConfig(){
    try{
      var snap = await state.db.collection("settings").doc("auth").get();
      if(snap && snap.exists){
        var d = snap.data() || {};
        var cfg = {
          staff1Name: d.staff1Name || AUTH_DEFAULTS.staff1Name,
          staff1Passcode: d.staff1Passcode || d.staffPasscode || AUTH_DEFAULTS.staff1Passcode,
          staff2Name: d.staff2Name || AUTH_DEFAULTS.staff2Name,
          staff2Passcode: d.staff2Passcode || AUTH_DEFAULTS.staff2Passcode,
          staff3Name: d.staff3Name || AUTH_DEFAULTS.staff3Name,
          staff3Passcode: (d.staff3Passcode !== undefined) ? d.staff3Passcode : AUTH_DEFAULTS.staff3Passcode,
          staff4Name: d.staff4Name || AUTH_DEFAULTS.staff4Name,
          staff4Passcode: (d.staff4Passcode !== undefined) ? d.staff4Passcode : AUTH_DEFAULTS.staff4Passcode,
          adminPasscode: d.adminPasscode || AUTH_DEFAULTS.adminPasscode
        };
        // migrate old single-staff-passcode docs to the new two-staff shape, once
        if(!d.staff1Passcode && (d.staffPasscode || !d.staff2Passcode)){
          try{ await state.db.collection("settings").doc("auth").set(cfg); }catch(e){}
        }
        return cfg;
      }
    }catch(e){ /* fall through to create defaults */ }
    try{ await state.db.collection("settings").doc("auth").set(AUTH_DEFAULTS); }catch(e){}
    return AUTH_DEFAULTS;
  }

  function savedRole(){
    try{ var r = localStorage.getItem(LOGIN_STORAGE_KEY); return (r === "admin" || r === "staff") ? r : null; }
    catch(e){ return null; }
  }
  function savedStaffLabel(){
    try{ return localStorage.getItem(LOGIN_LABEL_KEY) || ""; }catch(e){ return ""; }
  }
  function persistRole(role, label){
    try{
      localStorage.setItem(LOGIN_STORAGE_KEY, role);
      localStorage.setItem(LOGIN_LABEL_KEY, label || "");
    }catch(e){}
  }
  function clearPersistedRole(){
    try{ localStorage.removeItem(LOGIN_STORAGE_KEY); localStorage.removeItem(LOGIN_LABEL_KEY); }catch(e){}
  }

  function showLoginScreen(errMsg){
    document.querySelector(".toprow").style.display = "none";
    document.getElementById("tabs").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    var main = document.getElementById("main");
    main.innerHTML =
      '<div class="card" style="max-width:340px; margin:14vh auto 0;">' +
        '<h2 style="margin-bottom:2px;">🎱 Sign in</h2>' +
        '<p class="hint" style="margin-top:0;">RANU Snooker Premium Club</p>' +
        '<div class="field-row"><div style="flex:1 1 100%">' +
          '<label>Passcode</label>' +
          '<input type="password" id="loginPasscode" placeholder="Enter passcode" autocomplete="off">' +
        '</div></div>' +
        '<div id="loginError" style="color:var(--pl-neg); font-size:12px; min-height:16px; margin-top:2px;">'+(errMsg?escapeHtml(errMsg):'')+'</div>' +
        '<div class="form-actions"><button class="btn-primary" id="loginBtn">Sign in</button></div>' +
      '</div>';
    var btn = document.getElementById("loginBtn");
    var input = document.getElementById("loginPasscode");
    btn.addEventListener("click", attemptLogin);
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") attemptLogin(); });
    input.focus();
  }

  async function attemptLogin(){
    var input = document.getElementById("loginPasscode");
    var pass = (input.value || "").trim();
    if(!pass){ showLoginScreen("Enter a passcode."); return; }
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    var cfg = await getAuthConfig();
    var role = null, label = "";
    if(pass === cfg.adminPasscode){ role = "admin"; label = "Admin"; }
    else if(pass === cfg.staff1Passcode){ role = "staff"; label = cfg.staff1Name; }
    else if(pass === cfg.staff2Passcode){ role = "staff"; label = cfg.staff2Name; }
    else if(cfg.staff3Passcode && pass === cfg.staff3Passcode){ role = "staff"; label = cfg.staff3Name; }
    else if(cfg.staff4Passcode && pass === cfg.staff4Passcode){ role = "staff"; label = cfg.staff4Name; }
    if(!role){ showLoginScreen("Incorrect passcode."); return; }
    state.role = role;
    state.staffLabel = label;
    persistRole(role, label);
    enterApp();
  }

  function handleLogout(){
    clearPersistedRole();
    state.role = null;
    state.staffLabel = "";
    cleanupUnsub();
    if(state.tablesTimerHandle){ clearInterval(state.tablesTimerHandle); state.tablesTimerHandle = null; }
    showLoginScreen();
  }

  function enterApp(){
    document.querySelector(".toprow").style.display = "flex";
    document.getElementById("tabs").style.display = "";
    document.getElementById("logoutBtn").style.display = "";
    document.getElementById("logoutBtn").onclick = handleLogout;
    var sub = document.getElementById("headerSub");
    if(sub) sub.textContent = "Sales & Expense Manager — FY " + state.year + (state.staffLabel ? " · "+state.staffLabel : "");

    // Don't pre-emptively block or warn here — the platform's up-front read of
    // write access can be stale (e.g. right after being added as an editor).
    // The banner only appears once an actual save is refused (markWriteDenied).
    document.getElementById("writeAccessBanner").style.display = "none";

    // Staff only ever see today's data — no month/year navigation, no browsing
    // past history. That history stays admin-only.
    var isStaff = state.role === "staff";
    document.getElementById("yearSelect").style.display = isStaff ? "none" : "";
    document.getElementById("monthSelect").style.display = isStaff ? "none" : "";
    if(isStaff){
      var now = new Date();
      state.year = now.getFullYear();
      state.monthIdx = now.getMonth();
    }

    buildYearSelect();
    buildMonthSelect();
    var vt = visibleTabs().map(function(t){ return t.key; });
    if(vt.indexOf(state.tab) === -1) state.tab = vt[0];
    buildTabs();
    renderTab();
  }

  function recalcPurchaseTotal(){
    var grand = 0;
    for(var i=0;i<PURCHASE_ROW_COUNT;i++){
      var qty = parseFloat(document.getElementById("pr_qty_"+i).value)||0;
      var price = parseFloat(document.getElementById("pr_price_"+i).value)||0;
      var lineTotal = qty*price;
      document.getElementById("pr_total_"+i).textContent = fmtMoney(lineTotal);
      grand += lineTotal;
    }
    document.getElementById("pr_grandTotal").textContent = fmtMoney(grand);
    var itemized = document.getElementById("f_itemizedToggle").checked;
    if(itemized) document.getElementById("f_amount").value = grand > 0 ? grand : "";
  }

  function subscribeExpenseMenuItems(){
    state.expMenuUnsub && state.expMenuUnsub();
    state.expMenuItems = null;
    state.expMenuUnsub = state.db.collection("menuItems").onSnapshot(function(snap){
      state.expMenuItems = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      var options = state.expMenuItems.slice().sort(function(a,b){ return (a.data.name||"").localeCompare(b.data.name||""); })
        .map(function(m){ return '<option value="'+m.id+'">'+escapeHtml(m.data.name)+' ('+(m.data.stockQty||0)+' in stock)</option>'; }).join("");
      for(var i=0;i<PURCHASE_ROW_COUNT;i++){
        var sel = document.getElementById("pr_item_"+i);
        if(sel){
          var current = sel.value;
          sel.innerHTML = '<option value="">— Select item —</option>' + options;
          if(current) sel.value = current;
        }
      }
    }, function(){ state.expMenuItems = []; });
  }

  function updateNameLabel(){
    var catSel = document.getElementById("f_cat");
    var cat = catByKey(catSel.value);
    var lbl = document.getElementById("f_name_label");
    var inp = document.getElementById("f_name");
    lbl.textContent = cat.nameLabel;
    inp.placeholder = cat.placeholder;

    var isGrocery = catSel.value === "grocery";
    document.getElementById("f_purchaseToggleRow").style.display = isGrocery ? "" : "none";
    if(!isGrocery){
      document.getElementById("f_itemizedToggle").checked = false;
      document.getElementById("f_purchaseWrap").style.display = "none";
      document.getElementById("f_simpleRow").style.display = "";

  function lastDayOfMonth(idx){
    var d = new Date(state.year, idx+1, 0);
    return state.year + "-" + pad2(idx+1) + "-" + pad2(d.getDate());
  }

  function readPurchaseRows(){
    var rows = [];
    for(var i=0;i<PURCHASE_ROW_COUNT;i++){
      var itemId = document.getElementById("pr_item_"+i).value;
      var qty = parseFloat(document.getElementById("pr_qty_"+i).value)||0;
      var price = parseFloat(document.getElementById("pr_price_"+i).value)||0;
      if(itemId && qty>0 && price>0){
        var item = (state.expMenuItems||[]).filter(function(m){ return m.id===itemId; })[0];
        rows.push({menuItemId:itemId, name: item?item.data.name:"item", qty:qty, unitCost:price, lineTotal: Math.round(qty*price*100)/100});
      }
    }
    return rows;
  }

  async function addExpenseEntryUnified(){
    var catSel = document.getElementById("f_cat");
    var cat = catByKey(catSel.value);
    var dateEl = document.getElementById("f_date");
    var amtEl = document.getElementById("f_amount");
    var nameEl = document.getElementById("f_name");
    var date = dateEl.value;
    var itemized = cat.key === "grocery" && document.getElementById("f_itemizedToggle").checked;

    if(!date){ toast("Pick a date"); return; }

    var purchaseLines = [];
    var amount, name;

    if(itemized){
      purchaseLines = readPurchaseRows();
      if(purchaseLines.length === 0){ toast("Add at least one item with quantity and price"); return; }
      amount = purchaseLines.reduce(function(s,l){ return s+l.lineTotal; }, 0);
      var supplierNote = (document.getElementById("f_supplierNote").value||"").trim();
      name = (supplierNote ? supplierNote+": " : "") + purchaseLines.map(function(l){ return l.name+" x"+l.qty; }).join(", ");
    } else {
      amount = parseFloat(amtEl.value);
      name = (nameEl.value || "").trim();
      if(cat.key !== "charity" && !name){ toast(cat.nameLabel + " is required"); return; }
      if(isNaN(amount) || amount <= 0){ toast("Enter a valid amount"); return; }
    }

    var body = {date: date, amount: Math.round(amount*100)/100, enteredBy: state.staffLabel || (state.role==="admin"?"Admin":""), createdAt: new Date().toISOString()};
    body[cat.nameField] = name;
    if(itemized) body.items = purchaseLines;

    var addBtn = document.getElementById("addBtn");
    addBtn.disabled = true;
    try{
      await state.db.collection(cat.key).add(body);
      if(itemized){
        for(var i=0;i<purchaseLines.length;i++){
          var l = purchaseLines[i];
          await adjustStock(l.menuItemId, l.qty, "Purchased "+l.qty+" @ ₹"+l.unitCost+(name?" — "+name:""), {unitCost: l.unitCost, forceTrackStock: true, purchaseDate: date});
        }
        for(var j=0;j<PURCHASE_ROW_COUNT;j++){
          document.getElementById("pr_item_"+j).value = "";
          document.getElementById("pr_qty_"+j).value = "";
          document.getElementById("pr_price_"+j).value = "";
          document.getElementById("pr_total_"+j).textContent = "₹0";
        }
        document.getElementById("pr_grandTotal").textContent = "₹0";
        document.getElementById("f_supplierNote").value = "";
        amtEl.value = "";
      } else {
        amtEl.value = "";
        nameEl.value = "";
      }
      toast(cat.label + " entry added" + (itemized ? " — "+purchaseLines.length+" item(s) restocked" : ""));
    }catch(e){
      toast("Couldn't save: " + (e && e.code ? e.code : "error"));
    }
    addBtn.disabled = false;
  }

  function subscribeExpensesList(){
    cleanupUnsub();
    state.unsub = [];
    state.expenseCache = {};
    var start = monthStartDate(state.monthIdx);
    var end = monthEndDateExclusive(state.monthIdx);
    EXP_CATS.forEach(function(cat){
      var q = state.db.collection(cat.key).where("date", ">=", start).where("date", "<", end).orderBy("date","asc");
      var unsub = q.onSnapshot(function(snap){
        state.expenseCache[cat.key] = snap.docs.map(function(d){
          return {id: d.id, cat: cat.key, data: d.data()};
        });
        renderExpensesList();
      }, function(){
        state.expenseCache[cat.key] = [];
        renderExpensesList();
      });
      state.unsub.push(unsub);
    });
  }

  function renderExpensesList(){
    var wrap = document.getElementById("listWrap");
    if(!wrap || !state.expenseCache) return;

    var all = [];
    EXP_CATS.forEach(function(cat){
      (state.expenseCache[cat.key]||[]).forEach(function(item){ all.push(item); });
    });
    all.sort(function(a,b){ return a.data.date < b.data.date ? -1 : (a.data.date > b.data.date ? 1 : 0); });

    var filtered = (expenseFilter === "all") ? all : all.filter(function(x){ return x.cat === expenseFilter; });

    if(filtered.length === 0){
      wrap.innerHTML = '<div class="empty">No expense entries yet this month.</div>';
      document.getElementById("monthTotal").textContent = fmtMoney(0);
      return;
    }

    var total = 0;
    var html = '<div class="list">';
    filtered.forEach(function(item){
      var cat = catByKey(item.cat);
      var data = item.data;
      total += Number(data.amount)||0;
      var nm = data[cat.nameField] || "(no note)";
      html += '<div class="row">' +
        '<div class="main">' +
          '<div class="t1">'+escapeHtml(nm)+' <span class="badge" style="--chip:'+cat.color+'">'+cat.label+'</span></div>' +
          '<div class="t2">'+fmtDateShort(data.date)+'</div>' +
        '</div>' +
        '<div class="amt">'+fmtMoney(data.amount)+'</div>' +
        (state.role === "admin" ? '<button class="btn-danger" data-id="'+item.id+'" data-cat="'+item.cat+'">Delete</button>' : '') +
      '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
    document.getElementById("monthTotal").textContent = fmtMoney(total);

    wrap.querySelectorAll("button[data-id]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      var catKey = btn.getAttribute("data-cat");
      armDeleteButton(btn, function(){
        deleteWithAudit(catKey, id, {
          entryType: catByKey(catKey).label + " Expense",
          reverseInventory: function(d){
            // An itemized Grocery purchase added stock — deleting it must remove that stock again.
            if(catKey === "grocery" && d.items && d.items.length){
              return reverseInventoryForItems(d.items, -1, "Purchase deleted — stock removed");
            }
          },
          describe: function(d){
            var label = d.item || d.name || d.note || "entry";
            return catByKey(catKey).label + ": " + label;
          },
          getAmount: function(d){ return d.amount; }
        }).then(function(ok){
          if(ok) toast("Deleted");
          else { toast("Couldn't delete"); btn.disabled = false; disarmDeleteButton(btn); }
        });
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // Published pages run sandboxed and window.confirm()/alert() are silently blocked there,
  // so delete buttons must confirm in-page. First tap turns the button red and says
  // "Tap again", second tap (within 3s) runs the delete; any other action cancels it.
  function armDeleteButton(btn, onConfirm){
    btn.addEventListener("click", function(){
      if(btn.dataset.armed === "1"){
        clearTimeout(btn._disarmTimer);
        btn.disabled = true;
        onConfirm();
        return;
      }
      // disarm any other armed delete buttons on the page first
      document.querySelectorAll('button[data-armed="1"]').forEach(function(other){
        if(other !== btn) disarmDeleteButton(other);
      });
      btn.dataset.armed = "1";
      btn.dataset.origText = btn.textContent;
      btn.textContent = "Tap again";
      btn.style.background = "var(--pl-neg)";
      btn.style.color = "#fff";
      btn._disarmTimer = setTimeout(function(){ disarmDeleteButton(btn); }, 3000);
    });
  }
  function disarmDeleteButton(btn){
    btn.dataset.armed = "0";
    if(btn.dataset.origText) btn.textContent = btn.dataset.origText;
    btn.style.background = "";
    btn.style.color = "";
  }

  function subscribeDashboard(){
    state.unsubDashboard = state.unsubDashboard || [];
    state.unsubDashboard.forEach(function(u){ u(); });
    state.unsubDashboard = [];
    var isAdmin = state.role === "admin";
    var today = dashboardTodayStr();

    // Set every field this tab uses to null up front — a callback can fire
    // synchronously as soon as its own subscription registers, and at that
    // point any field whose subscription hasn't been registered yet must
    // read as null (not undefined), or the "still loading" guards below won't
    // catch it and a render function will crash trying to .filter(undefined).
    state.dashSalesToday = null;
    state.dashTablesLive = null;
    state.dashPs5Live = null;
    state.dashExpensesToday = {};
    REPORT_EXP_COLLECTIONS.forEach(function(col){ state.dashExpensesToday[col] = null; });
    state.dashMenuItems = null;
    state.dashMembershipsAll = null;
    state.dashCreditGiven = null;
    state.dashCreditOpening = null;
    state.dashCreditPaid = null;
    state.dashApprovalsAll = null;

    state.unsubDashboard.push(state.db.collection("sales").where("date","==",today).onSnapshot(function(snap){
      state.dashSalesToday = snap.docs.map(function(d){ return d.data(); });
      renderDashboardSales();
    }, function(){ state.dashSalesToday = []; renderDashboardSales(); }));

    state.unsubDashboard.push(state.db.collection("tables").onSnapshot(function(snap){
      state.dashTablesLive = snap.docs.map(function(d){ return d.data(); });
      renderDashboardTables();
    }, function(){ state.dashTablesLive = []; renderDashboardTables(); }));

    state.unsubDashboard.push(state.db.collection("ps5Consoles").onSnapshot(function(snap){
      state.dashPs5Live = snap.docs.map(function(d){ return d.data(); });
      renderDashboardPs5();
    }, function(){ state.dashPs5Live = []; renderDashboardPs5(); }));

    if(!isAdmin) return;

    REPORT_EXP_COLLECTIONS.forEach(function(col){
      state.unsubDashboard.push(state.db.collection(col).where("date","==",today).onSnapshot(function(snap){
        state.dashExpensesToday[col] = snap.docs.map(function(d){ return d.data(); });
        renderDashboardSales(); // also drives Net Cash / Expenses Today cards
      }, function(){ state.dashExpensesToday[col] = []; renderDashboardSales(); }));
    });

    state.unsubDashboard.push(state.db.collection("menuItems").onSnapshot(function(snap){
      state.dashMenuItems = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderDashboardAttention();
    }, function(){ state.dashMenuItems = []; renderDashboardAttention(); }));

    state.unsubDashboard.push(state.db.collection("memberships").onSnapshot(function(snap){
      state.dashMembershipsAll = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      renderDashboardAttention();
    }, function(){ state.dashMembershipsAll = []; renderDashboardAttention(); }));

    state.unsubDashboard.push(state.db.collection("sales").where("paymentType","==","credit").onSnapshot(function(snap){
      state.dashCreditGiven = snap.docs.map(function(d){ return d.data(); });
      renderDashboardAttention();
    }, function(){ state.dashCreditGiven = []; renderDashboardAttention(); }));
    state.unsubDashboard.push(state.db.collection("creditOpening").onSnapshot(function(snap){
      state.dashCreditOpening = snap.docs.map(function(d){ return d.data(); });
      renderDashboardAttention();
    }, function(){ state.dashCreditOpening = []; renderDashboardAttention(); }));
    state.unsubDashboard.push(state.db.collection("creditPayments").onSnapshot(function(snap){
      state.dashCreditPaid = snap.docs.map(function(d){ return d.data(); });
      renderDashboardAttention();
    }, function(){ state.dashCreditPaid = []; renderDashboardAttention(); }));

    state.dashApprovalsAll = null;
    state.unsubDashboard.push(state.db.collection("approvalRequests").onSnapshot(function(snap){
      state.dashApprovalsAll = snap.docs.map(function(d){ return d.data(); });
      renderDashboardAttention();
      renderDashboardActivity();
    }, function(){ state.dashApprovalsAll = []; renderDashboardAttention(); renderDashboardActivity(); }));
  }

  function renderDashboardSales(){
    var totalEl = document.getElementById("dash_salesTotal");
    if(!totalEl || state.dashSalesToday === null) return;
    var cash=0, upi=0, card=0, credit=0;
    state.dashSalesToday.forEach(function(rec){
      var amt = Number(rec.amount)||0, m = rec.paymentType;
      if(m==="credit") credit+=amt;
      else if(m==="upi") upi+=amt;
      else if(m==="credit_card"||m==="debit_card") card+=amt;
      else cash+=amt;
    });
    var total = cash+upi+card+credit;
    totalEl.textContent = fmtMoney(total);

    var breakdownEl = document.getElementById("dash_paymentBreakdown");
    if(breakdownEl){
      breakdownEl.innerHTML = '<div style="display:flex; gap:8px; flex-wrap:wrap; font-size:12.5px;">' +
        '<span class="badge" style="--chip:#15803d;">Cash '+fmtMoney(cash)+'</span>' +
        '<span class="badge" style="--chip:#0369a1;">UPI '+fmtMoney(upi)+'</span>' +
        '<span class="badge" style="--chip:#4338ca;">Card '+fmtMoney(card)+'</span>' +
        '<span class="badge" style="--chip:#b45309;">Credit '+fmtMoney(credit)+'</span>' +
      '</div>';
    }

    if(state.role !== "admin") return;
    var expEl = document.getElementById("dash_expensesTotal");
    var netEl = document.getElementById("dash_netCash");
    if(!expEl || !state.dashExpensesToday || REPORT_EXP_COLLECTIONS.some(function(c){ return state.dashExpensesToday[c] === null; })) return;
    var expenses = 0;
    REPORT_EXP_COLLECTIONS.forEach(function(col){ (state.dashExpensesToday[col]||[]).forEach(function(it){ expenses += Number(it.amount)||0; }); });
    expEl.textContent = fmtMoney(expenses);
    netEl.textContent = fmtMoney(cash - expenses);
  }

  function renderDashboardAttention(){
    var wrap = document.getElementById("dash_attentionWrap");
    if(!wrap) return;
    if([state.dashMenuItems, state.dashMembershipsAll, state.dashCreditGiven, state.dashCreditOpening, state.dashCreditPaid, state.dashApprovalsAll].some(function(x){ return x === null; })) return;

    var pending = state.dashApprovalsAll.filter(function(r){ return r.status === "pending"; }).length;

    var lowStock = state.dashMenuItems.filter(function(m){ return m.data.trackStock && (m.data.stockQty||0) <= (m.data.lowStockThreshold||5); }).length;

    var today = dashboardTodayStr();
    var soon = new Date(); soon.setDate(soon.getDate()+7);
    var soonStr = soon.getFullYear()+"-"+pad2(soon.getMonth()+1)+"-"+pad2(soon.getDate());
    var expiringSoon = state.dashMembershipsAll.filter(function(m){
      return !m.data.cancelled && m.data.expiryDate >= today && m.data.expiryDate <= soonStr;
    }).length;

    var parties = {};
    state.dashCreditGiven.forEach(function(r){ var p=r.party||"(unknown)"; parties[p]=(parties[p]||0)+(Number(r.amount)||0); });
    state.dashCreditOpening.forEach(function(r){ var p=r.party||"(unknown)"; parties[p]=(parties[p]||0)+(Number(r.amount)||0); });
    state.dashCreditPaid.forEach(function(r){ var p=r.party||"(unknown)"; parties[p]=(parties[p]||0)-(Number(r.amount)||0); });
    var totalOutstanding = Object.keys(parties).reduce(function(s,p){ return s + Math.max(0, parties[p]); }, 0);

    var cards = [
      {label:"Pending Approvals", value: pending, color: pending>0 ? "#b45309" : "var(--pl-pos)", tab:"tables"},
      {label:"Low Stock Items", value: lowStock, color: lowStock>0 ? "var(--pl-neg)" : "var(--pl-pos)", tab:"inventory"},
      {label:"Memberships Expiring (7d)", value: expiringSoon, color: expiringSoon>0 ? "#b45309" : "var(--pl-pos)", tab:"membership"},
      {label:"Credit Outstanding", value: fmtMoney(totalOutstanding), color: totalOutstanding>0 ? "#b45309" : "var(--pl-pos)", tab:"outstanding"}
    ];
    wrap.innerHTML = '<div style="display:flex; gap:10px; flex-wrap:wrap;">' + cards.map(function(c){
      return '<button data-dash-nav="'+c.tab+'" style="flex:1 1 140px; text-align:left; padding:12px; border:1px solid var(--border); border-radius:10px; background:none; cursor:pointer;">' +
        '<div class="hint" style="margin:0;">'+c.label+'</div><div style="font-size:18px; font-weight:700; color:'+c.color+';">'+c.value+'</div>' +
      '</button>';
    }).join("") + '</div>';

    wrap.querySelectorAll("button[data-dash-nav]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.tab = btn.getAttribute("data-dash-nav");
        buildTabs();
        renderTab();
      });
    });
  }

  async function addMenuItem(){

    var tax = parseFloat(document.getElementById("mi_tax").value) || 0;

  async function getRatesConfig(){
    try{
      var snap = await state.db.collection("settings").doc("rates").get();
      if(snap && snap.exists){
        var d = snap.data() || {};
        // migrate the old single-rate shape (hourlyRate/happyHourRate) to defaultHourlyRate/defaultHappyHourRate
        var cfg = {
          defaultHourlyRate: (typeof d.defaultHourlyRate === "number") ? d.defaultHourlyRate : ((typeof d.hourlyRate === "number") ? d.hourlyRate : RATE_DEFAULTS.defaultHourlyRate),
          defaultHappyHourRate: (typeof d.defaultHappyHourRate === "number") ? d.defaultHappyHourRate : ((typeof d.happyHourRate === "number") ? d.happyHourRate : RATE_DEFAULTS.defaultHappyHourRate),
          happyHourStart: d.happyHourStart || RATE_DEFAULTS.happyHourStart,
          happyHourEnd: d.happyHourEnd || RATE_DEFAULTS.happyHourEnd,
          tableRates: (d.tableRates && typeof d.tableRates === "object") ? d.tableRates : {}
        };
        if(!d.defaultHourlyRate && typeof d.hourlyRate === "number"){
          try{ await state.db.collection("settings").doc("rates").set(cfg); }catch(e){}
        }
        return cfg;
      }
    }catch(e){ /* fall through */ }
    try{ await state.db.collection("settings").doc("rates").set(RATE_DEFAULTS); }catch(e){}
    return RATE_DEFAULTS;
  }

  // Effective per-table rates: a table's own hourlyRate/happyHourRate if set, else the club default.
  // Happy-hour time window is shared club-wide.
  function getEffectiveTableRate(tableId, cfg){
    var override = (cfg.tableRates && cfg.tableRates[String(tableId)]) || {};
    return {
      hourlyRate: (typeof override.hourlyRate === "number") ? override.hourlyRate : cfg.defaultHourlyRate,
      happyHourRate: (typeof override.happyHourRate === "number") ? override.happyHourRate : cfg.defaultHappyHourRate,
      happyHourStart: cfg.happyHourStart,
      happyHourEnd: cfg.happyHourEnd
    };
  }

  function parseHHMM(s){
    var parts = (s||"00:00").split(":");
    return (parseInt(parts[0],10)||0) * 60 + (parseInt(parts[1],10)||0);
  }

  // Splits [start,end) into happy-hour vs regular minutes, day by day, using a
  // same-day happy-hour window (e.g. 14:00-18:00) that does not cross midnight.
  function splitSessionMinutes(start, end, rates){
    var hhStart = parseHHMM(rates.happyHourStart);
    var hhEnd = parseHHMM(rates.happyHourEnd);
    var regular = 0, happy = 0;
    var cursor = new Date(start);
    var guard = 0;
    while(cursor < end && guard < 30){ // guard: sessions shouldn't span >30 days
      guard++;
      var dayEnd = new Date(cursor);
      dayEnd.setHours(23,59,59,999);
      var segEnd = end < dayEnd ? end : dayEnd;
      var segMinutes = (segEnd - cursor) / 60000;
      var startOfDayMin = cursor.getHours()*60 + cursor.getMinutes() + cursor.getSeconds()/60;
      var endOfDayMin = startOfDayMin + segMinutes;
      var overlapStart = Math.max(startOfDayMin, hhStart);
      var overlapEnd = Math.min(endOfDayMin, hhEnd);
      var happyMin = Math.max(0, overlapEnd - overlapStart);
      happy += happyMin;
      regular += segMinutes - happyMin;
      cursor = new Date(dayEnd.getTime() + 1);
    }
    return {regularMinutes: regular, happyMinutes: happy};
  }

  // Billing rounds UP to the next 15-minute block — first 15 min is the minimum
  // charge, then 31-60min bills as 1hr, 61-90min bills as 1.5hr, and so on.
  // The happy-hour/regular split is computed against the BILLED (rounded) end
  // time, so the extra rounded-up minutes are priced by whichever rate is in
  // effect at that point in the block.
  var BILLING_BLOCK_MINUTES = 15; // shared by Tables and PS5 — 1-15min charges as one block, 16-30 as two, etc.
  function computeSessionBill(start, end, rates){
    var actualMinutes = Math.max(0, (end - start) / 60000);
    var blocks = actualMinutes > 0 ? Math.ceil(actualMinutes/BILLING_BLOCK_MINUTES - 1e-9) : 1;
    if(blocks < 1) blocks = 1;
    var billedMinutes = blocks * BILLING_BLOCK_MINUTES;
    var billedEnd = new Date(start.getTime() + billedMinutes*60000);
    var split = splitSessionMinutes(start, billedEnd, rates);
    var amount = (split.regularMinutes/60)*rates.hourlyRate + (split.happyMinutes/60)*rates.happyHourRate;
    return {
      actualMinutes: actualMinutes, blocks: blocks,
      regularMinutes: split.regularMinutes, happyMinutes: split.happyMinutes,
      totalMinutes: billedMinutes,
      amount: Math.round(amount * 100) / 100
    };
  }

  function fmtDuration(ms){
    var totalSec = Math.max(0, Math.floor(ms/1000));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec%60;
    if(h > 0) return h+"h "+pad2(m)+"m";
    return pad2(m)+":"+pad2(s);
  }

  async function getPs5RatesConfig(){
    try{
      var snap = await state.db.collection("settings").doc("ps5Rates").get();
      if(snap && snap.exists){
        var d = snap.data() || {};
        return {
          defaultHourlyRate: (typeof d.defaultHourlyRate === "number") ? d.defaultHourlyRate : PS5_RATE_DEFAULTS.defaultHourlyRate,
          defaultHappyHourRate: (typeof d.defaultHappyHourRate === "number") ? d.defaultHappyHourRate : PS5_RATE_DEFAULTS.defaultHappyHourRate,
          happyHourStart: d.happyHourStart || PS5_RATE_DEFAULTS.happyHourStart,
          happyHourEnd: d.happyHourEnd || PS5_RATE_DEFAULTS.happyHourEnd,
          consoleRates: (d.consoleRates && typeof d.consoleRates === "object") ? d.consoleRates : {}
        };
      }
    }catch(e){ /* fall through */ }

    return PS5_RATE_DEFAULTS;
  }
  // Same happy-hour mechanics as Tables: a shared time window, with each
  // console able to override its own hourly and happy-hour rate.
  function getEffectivePs5Rate(num, cfg){
    var override = (cfg.consoleRates && cfg.consoleRates[String(num)]) || {};
    return {
      hourlyRate: (typeof override.hourlyRate === "number") ? override.hourlyRate : cfg.defaultHourlyRate,
      happyHourRate: (typeof override.happyHourRate === "number") ? override.happyHourRate : cfg.defaultHappyHourRate,
      happyHourStart: cfg.happyHourStart,
      happyHourEnd: cfg.happyHourEnd
    };
  }
  // Excludes accumulated pause time from the bill by shifting the "end" used
  // for billing back by the paused duration.
  function computePs5Bill(startISO, endDate, pausedMs, rates){
    var start = new Date(startISO);
    var effectiveEnd = new Date(endDate.getTime() - (pausedMs||0));
    if(effectiveEnd < start) effectiveEnd = new Date(start.getTime());
    return computeSessionBill(start, effectiveEnd, rates);
  }
  function ps5ElapsedMs(d, now){
    if(d.status === "paused") return new Date(d.pausedAt).getTime() - new Date(d.startedAt).getTime() - (d.totalPausedMs||0);
    return now.getTime() - new Date(d.startedAt).getTime() - (d.totalPausedMs||0);
  }

  function wirePs5StartPanel(){
    var panel = document.getElementById("ps5PanelFor");
    if(!panel || startingPs5Num === null) return;
    var num = panel.getAttribute("data-console");
    var nameEl = document.getElementById("p5g_name");
    var mobileEl = document.getElementById("p5g_mobile");
    var noteEl = document.getElementById("p5g_matchNote");
    var cancelBtn = document.getElementById("p5g_cancelBtn");
    var confirmBtn = document.getElementById("p5g_confirmBtn");

    nameEl.addEventListener("input", function(){
      var m = findCustomerByGateLabel(nameEl.value);
      if(m){
        mobileEl.value = m.data.whatsappDisplay || m.data.whatsapp || "";
        noteEl.textContent = "Existing customer ✓";
        noteEl.style.color = "var(--pl-pos)";
      } else {
        noteEl.textContent = nameEl.value ? "New customer — will be registered" : "";
        noteEl.style.color = "var(--muted)";
      }
    });

    cancelBtn.addEventListener("click", function(){ startingPs5Num = null; renderPs5Grid(true); });
    confirmBtn.addEventListener("click", async function(){
      var name = (nameEl.value||"").trim();
      var mobile = (mobileEl.value||"").trim();
      if(!name){ toast("Customer name is required"); return; }
      if(!mobile || mobile.replace(/\D/g,"").length < 10){ toast("Enter a valid mobile number"); return; }

      confirmBtn.disabled = true;
      try{
        var match = findCustomerByGateLabel(nameEl.value);
        var customerId, customerName, customerMobile;
        if(match){
          customerId = match.id; customerName = match.data.name;
          customerMobile = match.data.whatsappDisplay || match.data.whatsapp || mobile;
        } else {
          var waDigits = normalizeWa(mobile);
          var ref = await state.db.collection("customers").add({
            name: name, whatsapp: waDigits, whatsappDisplay: mobile, notes: "",
            createdAt: new Date().toISOString()
          });
          customerId = ref.id; customerName = name; customerMobile = mobile;
        }

        // Same lock as Tables — if this customer has a membership, reserve it
        // to this console now so it can't be double-booked elsewhere.
        var member = findMembershipForCustomer(customerId, "ps5");
        var membershipId = null, membershipCode = null;
        if(member){
          var conflict = findMembershipConflict(member.id, "ps5", num);
          if(conflict){
            toast("This membership is already active on "+conflict+". Please finish the existing session first.");
            confirmBtn.disabled = false;
            return;
          }
          membershipId = member.id; membershipCode = member.data.code;
        }

        await state.db.collection("ps5Consoles").doc(num).set({
          number: Number(num), status: "active",
          customerName: customerName, customerId: customerId, customerMobile: customerMobile,
          membershipId: membershipId, membershipCode: membershipCode,
          startedAt: new Date().toISOString(), startedBy: currentIdentityLabel(),

  function wirePs5CheckoutPanel(){
    var panel = document.getElementById("ps5PanelFor");
    if(!panel || checkoutPs5Num === null) return;
    var num = panel.getAttribute("data-console");
    var baseAmount = parseFloat(panel.getAttribute("data-bill-amount"))||0;
    var memberToggle = document.getElementById("p5co_memberToggle");

    function lockedPs5Member(){
      var c = (state.ps5All||[]).filter(function(x){ return x.id === num; })[0];
      if(!c) return null;
      if(c.data.membershipId){
        return (state.membershipsCache||[]).filter(function(m){ return m.id === c.data.membershipId; })[0] || null;
      }
      return findMembershipForCustomer(c.data.customerId, "ps5"); // fallback for sessions started before this lock existed
    }
    function currentActualMinutes(){
      var c = (state.ps5All||[]).filter(function(x){ return x.id === num; })[0];
      if(!c) return 0;
      var now = new Date();
      var pausedMs = c.data.totalPausedMs || 0;
      if(c.data.status === "paused") pausedMs += Math.max(0, now.getTime() - new Date(c.data.pausedAt).getTime());
      var rates = getEffectivePs5Rate(num, ps5RatesCache || PS5_RATE_DEFAULTS);
      return computePs5Bill(c.data.startedAt, now, pausedMs, rates).actualMinutes;
    }
    function currentDueAmount(){
      if(!memberToggle.checked) return baseAmount;
      var member = lockedPs5Member();
      if(!member) return baseAmount;
      var rates = getEffectivePs5Rate(num, ps5RatesCache || PS5_RATE_DEFAULTS);
      return computeMemberOverage(new Date(), currentActualMinutes(), member, rates).amount;
    }
    function refreshMemberInfo(){
      var infoEl = document.getElementById("p5co_memberInfo");
      if(!memberToggle.checked){ infoEl.style.display = "none"; return; }
      infoEl.style.display = "";
      var member = lockedPs5Member();
      if(!member){
        infoEl.textContent = "No active membership found for this customer.";
        infoEl.style.color = "var(--pl-neg)";
        return;
      }
      var remaining = (member.data.totalHours||0) - (member.data.hoursUsed||0);
      infoEl.textContent = "Member: "+member.data.name+" ("+member.data.code+") — "+remaining.toFixed(1)+"h remaining"+(remaining<=0?" — no hours left, session will be charged as overage":"");
      infoEl.style.color = remaining>0 ? "var(--pl-pos)" : "#b45309";
    }
    function refreshAll(){
      refreshMemberInfo();
      var overageEl = document.getElementById("p5co_memberOverage");
      if(memberToggle.checked){
        var member = lockedPs5Member();
        if(member){
          var rates = getEffectivePs5Rate(num, ps5RatesCache || PS5_RATE_DEFAULTS);
          var ov = computeMemberOverage(new Date(), currentActualMinutes(), member, rates);
          overageEl.textContent = ov.overageMinutes>0 ? ("Overage: "+ov.overageMinutes+" min beyond balance — "+fmtMoney(ov.amount)) : "Fully covered by membership — ₹0 due";
        } else { overageEl.textContent = ""; }
      } else { overageEl.textContent = ""; }
      document.getElementById("p5co_amountDisplay").textContent = fmtMoney(currentDueAmount());
    }

    memberToggle.addEventListener("change", refreshAll);

    document.getElementById("p5co_payWrap").innerHTML = renderPaymentSectionHtml("p5co_pay", "partyList", "Payment");
    wirePaymentSection("p5co_pay", currentDueAmount, refreshAll);
    refreshAll();

    document.getElementById("p5co_cancelBtn").addEventListener("click", function(){ checkoutPs5Num = null; renderPs5Grid(true); });
    document.getElementById("p5co_confirmBtn").addEventListener("click", async function(){
      var usingMember = memberToggle.checked;
      var member = usingMember ? lockedPs5Member() : null;
      if(usingMember && !member){ toast("No active membership found for this customer."); return; }

      var btn = document.getElementById("p5co_confirmBtn");
      btn.disabled = true;
      try{
        var snap = await state.db.collection("ps5Consoles").doc(num).get();
        var d = snap.data();
        var end = new Date();
        var pausedMs = d.totalPausedMs || 0;
        if(d.status === "paused") pausedMs += Math.max(0, end.getTime() - new Date(d.pausedAt).getTime());
        var rates = getEffectivePs5Rate(num, ps5RatesCache || PS5_RATE_DEFAULTS);
        var bill = computePs5Bill(d.startedAt, end, pausedMs, rates);
        var today = end.getFullYear()+"-"+pad2(end.getMonth()+1)+"-"+pad2(end.getDate());
        var enteredBy = state.staffLabel || (state.role === "admin" ? "Admin" : "");
        var sessionKey = "P5_"+num+"_"+d.startedAt;

        var dueAmount = bill.amount;
        var overage = null;
        if(usingMember){
          overage = computeMemberOverage(end, bill.actualMinutes, member, rates);
          dueAmount = overage.amount;
        }

        var payment = null;
        if(dueAmount > 0){
          payment = readPaymentSection("p5co_pay", dueAmount);
          if(!payment){ btn.disabled = false; return; }
        }

        if(usingMember){
          var coveredHours = overage.coveredMinutes / 60;
          var newHoursUsed = Math.round(((member.data.hoursUsed||0) + coveredHours) * 100) / 100;
          var remainingAfter = Math.round(((member.data.totalHours||0) - newHoursUsed) * 100) / 100;
          await state.db.collection("membershipDeductions").add({
            membershipId: member.id, membershipCode: member.data.code, memberName: member.data.name,
            customerId: d.customerId||null, customerName: d.customerName||member.data.name, customerMobile: d.customerMobile||member.data.mobile||null,
            ps5Number: Number(num), sessionKey: sessionKey, startTime: d.startedAt, endTime: end.toISOString(),
            playedMinutes: Math.round(bill.actualMinutes*100)/100, minutesUsed: Math.round(overage.coveredMinutes),
            hoursUsed: Math.round(coveredHours*100)/100, remainingHoursAfter: remainingAfter,
            date: today, enteredBy: enteredBy, createdAt: new Date().toISOString()
          });
          await state.db.collection("memberships").doc(member.id).update({
            hoursUsed: newHoursUsed
          });
        }

        if(payment){
          await writePaymentLines(payment, dueAmount, async function(lineAmount, method, reference, party, info){
            var body = {
              date: today, day: DAY_NAMES[end.getDay()], source: "ps5", amount: lineAmount,
              paymentType: method, paymentReference: reference||"", party: (method==="credit" ? party : null),
              partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
              partyMembershipCode: (method==="credit" ? info.membershipCode : null),
              ps5Number: Number(num), sessionKey: sessionKey, customerName: d.customerName||"",
              startTime: d.startedAt, endTime: end.toISOString(), pausedMs: pausedMs,
              totalMinutes: bill.totalMinutes, actualMinutes: Math.round(bill.actualMinutes), blocks: bill.blocks,
              hourlyRate: rates.hourlyRate,
              membershipCode: usingMember ? member.data.code : null, memberName: usingMember ? member.data.name : null,
              note: usingMember ? "Overage beyond membership balance" : null,
              enteredBy: enteredBy, createdAt: new Date().toISOString()
            };
            await state.db.collection("sales").add(body);
          });
        }

        await state.db.collection("ps5Sessions").add({
          ps5Number: Number(num), sessionKey: sessionKey, customerName: d.customerName||"",
          startTime: d.startedAt, endTime: end.toISOString(), pausedMs: pausedMs,
          totalMinutes: bill.totalMinutes, actualMinutes: Math.round(bill.actualMinutes), blocks: bill.blocks,
          hourlyRate: rates.hourlyRate, amount: dueAmount,
          usingMember: usingMember, membershipCode: usingMember ? member.data.code : null, memberName: usingMember ? member.data.name : null,
          date: today, enteredBy: enteredBy, createdAt: new Date().toISOString()
        });
        await state.db.collection("ps5Consoles").doc(num).set({number: Number(num), status:"idle"});
        checkoutPs5Num = null;
        toast("PS5 #"+num+" ended"+(dueAmount>0 ? " — "+fmtMoney(dueAmount) : " — fully covered by membership"));
      }catch(e){
        toast("Couldn't complete checkout");
        btn.disabled = false;
      }
    });
  }

  async function ensureTablesExist(){

          await state.db.collection("tables").doc(id).set({number:i, status:"idle", startedAt:null, startedBy:null});
        }catch(e){ /* ignore, will retry next load */ }

  // renderTableGrid(forceFull): while a checkout card is open and already in the
  // DOM, ticking every second must NOT rebuild the form (that would wipe out
  // anything typed). Instead the interval just nudges the live numbers. A full
  // rebuild only happens on real state changes (start/finish/open/cancel/a
  // Firestore update) via forceFull=true.
  function renderTableGrid(forceFull){
    var grid = document.getElementById("tablesGrid");
    if(!grid || state.tablesAll === null) return;

    if(!forceFull && checkoutTableNum && document.getElementById("checkoutCardFor")){
      updateLiveNumbersOnly();
      return;
    }
    if(!forceFull && orderTableNum && document.getElementById("orderPanelFor")){
      updateActiveTimersOnly();
      return;
    }
    if(!forceFull && startingTableNum && document.getElementById("customerGateFor")){
      updateActiveTimersOnly();
      return;
    }

    var tables = state.tablesAll.slice().sort(function(a,b){ return (Number(a.id)||0) - (Number(b.id)||0); });
    if(tables.length === 0){
      grid.innerHTML = '<div class="empty">Setting up tables…</div>';
      return;
    }

    var now = Date.now();
    var html = "";
    tables.forEach(function(t){
      var d = t.data;
      var isActive = d.status === "active";
      var isCheckout = checkoutTableNum === t.id;
      var elapsed = isActive && d.startedAt ? fmtDuration(now - new Date(d.startedAt).getTime()) : "";

      html += '<div class="card" style="margin:0; padding:12px; border-color:'+(isActive?'var(--sales)':'var(--border)')+';">' +
        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
          '<div style="font-weight:700; font-size:15px;">Table '+t.id+'</div>' +
          '<span class="badge" style="--chip:'+(isActive?'#15803d':'#6b7280')+';">'+(isActive?'Active':'Idle')+'</span>' +
        '</div>';

      if(isActive){
        html += '<div id="tt-timer-'+t.id+'" style="font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; margin:8px 0;">'+elapsed+'</div>';
        if(d.customerName) html += '<div class="hint" style="margin:0 0 4px; color:var(--text);">👤 '+escapeHtml(d.customerName)+'</div>';
        if(d.startedBy) html += '<div class="hint" style="margin:0 0 8px;">by '+escapeHtml(d.startedBy)+'</div>';
        var orderCount = (d.order||[]).filter(function(x){ return !x.cancelled; }).length;
        if(orderCount > 0) html += '<div class="hint" style="margin:0 0 6px;">🍽 '+orderCount+' item'+(orderCount>1?'s':'')+' ordered</div>';
        if(!isCheckout){
          html += '<button class="btn-ghost" style="width:100%; border:1px solid var(--border); margin-bottom:6px;" data-order="'+t.id+'">Order Food/Drinks</button>';
          html += '<button class="btn-danger" style="width:100%;" data-finish="'+t.id+'">Finish &amp; Bill</button>';
        }
      } else {
        html += '<div style="height:36px;"></div>';
        html += '<button class="btn-primary" style="width:100%;" data-select-customer="'+t.id+'">Start</button>';
      }
      html += '</div>';

      if(isCheckout){
        html += renderCheckoutCardHtml(t);
      }
      if(orderTableNum === t.id){
        html += renderOrderPanelHtml(t);
      }
      if(startingTableNum === t.id){
        html += renderCustomerGateHtml(t);
      }
    });

    html += renderReceiptCardHtml();

    grid.innerHTML = html;

    grid.querySelectorAll("button[data-select-customer]").forEach(function(btn){
      btn.addEventListener("click", function(){
        startingTableNum = btn.getAttribute("data-select-customer");

        orderTableNum = null;
        renderTableGrid(true);
      });
    });
    grid.querySelectorAll("button[data-finish]").forEach(function(btn){
      btn.addEventListener("click", function(){
        checkoutTableNum = btn.getAttribute("data-finish");
        orderTableNum = null;
        renderTableGrid(true);
      });
    });
    grid.querySelectorAll("button[data-order]").forEach(function(btn){
      btn.addEventListener("click", function(){
        orderTableNum = btn.getAttribute("data-order");
        checkoutTableNum = null;
        orderSearch = "";
        renderTableGrid(true);
      });
