    var dl1 = document.getElementById("partyList");
    if(dl1) dl1.innerHTML = optsHtml;
    var dl3 = document.getElementById("partyList3");
    if(dl3) dl3.innerHTML = optsHtml;
  }

  function renderPartyBalances(){
    var wrap = document.getElementById("balanceWrap");
    if(!wrap || state.creditGivenAll === null || state.creditOpeningAll === null || state.creditPaymentsAll === null) return;

    var parties = {};
    state.creditGivenAll.forEach(function(x){
      var p = x.data.party || "(unknown)";
      parties[p] = parties[p] || {opening:0, given:0, paid:0};
      parties[p].given += Number(x.data.amount)||0;
    });
    state.creditOpeningAll.forEach(function(x){
      var p = x.data.party || "(unknown)";
      parties[p] = parties[p] || {opening:0, given:0, paid:0};
      parties[p].opening += Number(x.data.amount)||0;
    });
    state.creditPaymentsAll.forEach(function(x){
      var p = x.data.party || "(unknown)";
      parties[p] = parties[p] || {opening:0, given:0, paid:0};
      parties[p].paid += Number(x.data.amount)||0;
    });

    var names = Object.keys(parties);
    if(names.length === 0){
      wrap.innerHTML = '<div class="empty">No credit customers yet. Add a credit sale from POS, or an opening balance above.</div>';
      document.getElementById("outstandingTotal").textContent = fmtMoney(0);
      return;
    }
    names.sort(function(a,b){
      var ba = parties[a].opening + parties[a].given - parties[a].paid, bb = parties[b].opening + parties[b].given - parties[b].paid;
      return bb - ba;
    });

    var totalOutstanding = 0;
    var html = '<div class="list">';
    names.forEach(function(name){
      var p = parties[name];
      var bal = p.opening + p.given - p.paid;
      totalOutstanding += bal;
      var openingNote = p.opening > 0 ? (' · Opening '+fmtMoney(p.opening)) : '';
      html += '<div class="row" data-party="'+escapeHtml(name)+'" style="cursor:pointer;">' +
        '<div class="main"><div class="t1">'+escapeHtml(name)+'</div>' +
        '<div class="t2">Credit given '+fmtMoney(p.given)+openingNote+' · Paid '+fmtMoney(p.paid)+'</div></div>' +
        '<div class="amt" style="color:'+(bal>0?'var(--pl-neg)':'var(--pl-pos)')+'">'+fmtMoney(bal)+'</div>' +
      '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;
    document.getElementById("outstandingTotal").textContent = fmtMoney(totalOutstanding);

    wrap.querySelectorAll(".row[data-party]").forEach(function(row){
      row.addEventListener("click", function(){
        creditPartyFocus = row.getAttribute("data-party");
        renderCreditTab();
      });
    });
  }

  function renderCreditTxnList(){
    var wrap = document.getElementById("txnWrap");
    if(!wrap || state.creditGivenMonth === null || state.creditOpeningMonth === null || state.creditPaymentsMonth === null) return;

    var all = state.creditGivenMonth.concat(state.creditOpeningMonth, state.creditPaymentsMonth);
    all.sort(function(a,b){ return a.data.date < b.data.date ? -1 : (a.data.date > b.data.date ? 1 : 0); });

    var filtered = all;
    if(creditFilter !== "all") filtered = filtered.filter(function(x){ return x.type === creditFilter; });
    if(creditPartyFocus) filtered = filtered.filter(function(x){ return x.data.party === creditPartyFocus; });

    if(filtered.length === 0){
      wrap.innerHTML = '<div class="empty">No transactions match this filter.</div>';
      return;
    }

    var html = '<div class="list">';
    filtered.forEach(function(item){
      var data = item.data;
      var isPayment = item.type === "payment";

      var color = isPayment ? "#15803d" : (isOpening ? "#7c3aed" : "#b45309");
      var sign = isPayment ? "−" : "+";
      var label = isPayment ? "Payment" : (isOpening ? "Opening Balance" : "Credit Given (POS)");
      var sub = data.note ? escapeHtml(data.note) : (data.source ? (data.source==='cafeteria'?'Cafeteria':'Board') : '');
      html += '<div class="row">' +
        '<div class="main">' +
          '<div class="t1">'+escapeHtml(data.party)+' <span class="badge" style="--chip:'+color+'">'+label+'</span></div>' +
          '<div class="t2">'+fmtDateShort(data.date)+(sub ? ' · '+sub : '')+'</div>' +
        '</div>' +
        '<div class="amt" style="color:'+color+'">'+sign+fmtMoney(data.amount)+'</div>' +
        (state.role === "admin" ? '<button class="btn-danger" data-id="'+item.id+'" data-type="'+item.type+'">Delete</button>' : '') +
      '</div>';
    });
    html += '</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll("button[data-id]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      var type = btn.getAttribute("data-type");
      var col = (type === "given") ? "sales" : (type === "opening" ? "creditOpening" : "creditPayments");
      armDeleteButton(btn, function(){
        deleteWithAudit(col, id, {
          entryType: type === "given" ? "Credit Given" : (type === "opening" ? "Opening Balance" : "Due Payment"),
          reverseInventory: (type === "given") ? reverseSaleEffects : undefined,
          describe: function(d){
            if(type === "given") return "Credit given — " + describeSaleForAudit(d) + (d.party ? " · "+d.party : "");
            if(type === "opening") return "Opening balance removed — "+(d.party||"");
            return "Due payment removed — "+(d.party||"");
          },
          getAmount: function(d){ return d.amount; },
          getTableNumber: function(d){ return type === "given" ? d.tableNumber : null; },
          getPaymentMethod: function(d){ return type === "given" ? d.paymentType : (type === "payment" ? d.method : null); }
        }).then(function(ok){
          if(ok) toast("Deleted");
          else { toast("Couldn't delete"); btn.disabled = false; disarmDeleteButton(btn); }
        });
      });
    });
  }

  function renderOutstandingTable(){
    var body = document.getElementById("outstandingBody");
    var foot = document.getElementById("outstandingFoot");
    if(!body || state.orGivenAll === null || state.orOpeningAll === null || state.orPaidAll === null) return;

    var from = outstandingFromDate, to = outstandingToDate;
    function inRange(d){
      if(from && d < from) return false;
      if(to && d > to) return false;
      return true;
    }

    var parties = {};
    state.orGivenAll.filter(function(rec){ return inRange(rec.date); }).forEach(function(rec){
      var p = rec.party || "(unknown)";
      parties[p] = parties[p] || {given:0, opening:0, paid:0, firstDate:null};
      parties[p].given += Number(rec.amount)||0;
      if(!parties[p].firstDate || rec.date < parties[p].firstDate) parties[p].firstDate = rec.date;
    });
    state.orOpeningAll.filter(function(rec){ return inRange(rec.date); }).forEach(function(rec){
      var p = rec.party || "(unknown)";
      parties[p] = parties[p] || {given:0, opening:0, paid:0, firstDate:null};
      parties[p].opening += Number(rec.amount)||0;
      if(!parties[p].firstDate || rec.date < parties[p].firstDate) parties[p].firstDate = rec.date;
    });
    state.orPaidAll.filter(function(rec){ return inRange(rec.date); }).forEach(function(rec){
      var p = rec.party || "(unknown)";
      parties[p] = parties[p] || {given:0, opening:0, paid:0, firstDate:null};
      parties[p].paid += Number(rec.amount)||0;
    });

    var names = Object.keys(parties).filter(function(n){ return (parties[n].opening + parties[n].given - parties[n].paid) > 0.004; });
    var rangeNote = (from || to) ? (' for ' + (from ? fmtDateFull(from) : 'the start') + ' – ' + (to ? fmtDateFull(to) : 'now')) : '';

    if(names.length === 0){
      body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">No outstanding dues'+escapeHtml(rangeNote)+' 🎉</td></tr>';
      foot.innerHTML = "";
      document.getElementById("or_total").textContent = fmtMoney(0);
      document.getElementById("or_count").textContent = "0";
      document.getElementById("or_oldest").textContent = "—";
      return;
    }

    names.sort(function(a,b){
      var ba = parties[a].opening + parties[a].given - parties[a].paid, bb = parties[b].opening + parties[b].given - parties[b].paid;
      return bb - ba;
    });

    var totalOutstanding = 0;
    var totalGiven = 0, totalPaid = 0;
    var oldest = null;
    var rowsHtml = "";
    names.forEach(function(name){
      var p = parties[name];
      var givenPlusOpening = p.given + p.opening;
      var bal = givenPlusOpening - p.paid;
      totalOutstanding += bal;
      totalGiven += givenPlusOpening;
      totalPaid += p.paid;
      if(p.firstDate && (!oldest || p.firstDate < oldest)) oldest = p.firstDate;
      rowsHtml += '<tr>' +
        '<td style="text-align:left;">'+escapeHtml(name)+(p.opening>0?' <span class="badge" style="--chip:#7c3aed;">Opening</span>':'')+'</td>' +
        '<td>'+fmtMoney(givenPlusOpening)+'</td>' +
        '<td>'+fmtMoney(p.paid)+'</td>' +
        '<td class="pl-neg" style="font-weight:700;">'+fmtMoney(bal)+'</td>' +
        '<td>'+(p.firstDate ? fmtDateFull(p.firstDate) : '—')+'</td>' +
      '</tr>';
    });
    body.innerHTML = rowsHtml;
    foot.innerHTML = '<tr>' +
      '<td style="text-align:left;">TOTAL</td>' +
      '<td>'+fmtMoney(totalGiven)+'</td>' +
      '<td>'+fmtMoney(totalPaid)+'</td>' +
      '<td class="pl-neg">'+fmtMoney(totalOutstanding)+'</td>' +
      '<td></td>' +
    '</tr>';

    document.getElementById("or_total").textContent = fmtMoney(totalOutstanding);
    document.getElementById("or_count").textContent = String(names.length);
    document.getElementById("or_oldest").textContent = oldest ? fmtDateFull(oldest) : "—";
  }

      if(m==="credit"){ byDate[rec.date].credit+=amt; totalCredit+=amt; }
      else if(m==="upi"){ byDate[rec.date].upi+=amt; totalUpi+=amt; }
      else if(m==="credit_card"||m==="debit_card"){ byDate[rec.date].card+=amt; totalCard+=amt; }
      else { byDate[rec.date].cash+=amt; totalCash+=amt; }

  // ---------- Table Usage report ----------
  function renderTableUsageReport(){
    var wrap = document.getElementById("reportBodyWrap");
    if(!wrap || state.repTableSessions === null) return reportLoading();

    var byTable = {};
    state.repTableSessions.forEach(function(s){
      var t = s.tableNumber;
      byTable[t] = byTable[t] || {sessions:0, minutes:0, tableRevenue:0, fbRevenue:0, totalRevenue:0, memberSessions:0};
      var tableRev = (Number(s.tableAmount)||0) + (Number(s.overageAmount)||0);
      var totalRev = Number(s.amount)||0;
      // F&B is the remainder of what was actually charged, not the raw pre-discount
      // cafeteria field — this guarantees Table + F&B always equals Total exactly,
      // even on sessions where a discount was applied.
      var fbRev = Math.round((totalRev - tableRev) * 100) / 100;
      byTable[t].sessions += 1;
      byTable[t].minutes += Number(s.actualMinutes||s.totalMinutes)||0;
      byTable[t].tableRevenue += tableRev;
      byTable[t].fbRevenue += fbRev;
      byTable[t].totalRevenue += totalRev;
      if(s.usingMember) byTable[t].memberSessions += 1;
    });
    var tables = Object.keys(byTable).map(Number).sort(function(a,b){return a-b;});
    var totalSessions=0, totalMinutes=0, grandTable=0, grandFb=0, grandTotal=0;
    tables.forEach(function(t){
      var v = byTable[t];
      totalSessions+=v.sessions; totalMinutes+=v.minutes;
      grandTable+=v.tableRevenue; grandFb+=v.fbRevenue; grandTotal+=v.totalRevenue;
    });

    var rows = tables.length === 0
      ? '<tr><td colspan="7" style="text-align:center;color:var(--muted);">No table sessions in this range.</td></tr>'
      : tables.map(function(t){
          var v = byTable[t];
          return '<tr><td style="text-align:left;">Table '+t+'</td><td>'+v.sessions+'</td><td>'+v.memberSessions+'</td><td>'+(v.minutes/60).toFixed(1)+'h</td>' +
            '<td>'+fmtMoney(v.tableRevenue)+'</td><td>'+fmtMoney(v.fbRevenue)+'</td><td style="font-weight:700;">'+fmtMoney(v.totalRevenue)+'</td></tr>';
        }).join("");
    var foot = tables.length ? '<tr style="font-weight:700;"><td style="text-align:left;">TOTAL</td><td>'+totalSessions+'</td><td></td><td>'+(totalMinutes/60).toFixed(1)+'h</td>' +
      '<td>'+fmtMoney(grandTable)+'</td><td>'+fmtMoney(grandFb)+'</td><td>'+fmtMoney(grandTotal)+'</td></tr>' : '';

    wrap.innerHTML = reportCardShell("Table Usage", 
      '<div class="scrollx"><table class="summary"><thead><tr><th style="text-align:left;">Table</th><th>Sessions</th><th>Member</th><th>Hours</th><th>Table Revenue</th><th>F&amp;B Revenue</th><th>Total Revenue</th></tr></thead>' +
      '<tbody>'+rows+'</tbody><tfoot>'+foot+'</tfoot></table></div>',
      "Table Revenue = playing time + overage. F&amp;B Revenue = food/drinks. Member-only sessions show ₹0 Table Revenue since that time is deducted from hours instead of billed.");
  }

    state.repPs5Sessions.forEach(function(s){
      var n = s.ps5Number;
      byConsole[n] = byConsole[n] || {sessions:0, minutes:0, revenue:0};
      byConsole[n].sessions += 1;
      byConsole[n].minutes += Number(s.actualMinutes||s.totalMinutes)||0;
      byConsole[n].revenue += Number(s.amount)||0;
    });
    var consoles = Object.keys(byConsole).map(Number).sort(function(a,b){return a-b;});
    var totalSessions=0, totalMinutes=0, totalRevenue=0;
    consoles.forEach(function(n){ totalSessions+=byConsole[n].sessions; totalMinutes+=byConsole[n].minutes; totalRevenue+=byConsole[n].revenue; });

    var rows = consoles.length === 0
      ? '<tr><td colspan="4" style="text-align:center;color:var(--muted);">No PS5 sessions in this range.</td></tr>'
      : consoles.map(function(n){
          var v = byConsole[n];
          return '<tr><td style="text-align:left;">PS5 #'+n+'</td><td>'+v.sessions+'</td><td>'+(v.minutes/60).toFixed(1)+'h</td><td style="font-weight:700;">'+fmtMoney(v.revenue)+'</td></tr>';
        }).join("");
    var foot = consoles.length ? '<tr style="font-weight:700;"><td style="text-align:left;">TOTAL</td><td>'+totalSessions+'</td><td>'+(totalMinutes/60).toFixed(1)+'h</td><td>'+fmtMoney(totalRevenue)+'</td></tr>' : '';

    wrap.innerHTML = reportCardShell("PS5 Usage",
      '<div class="scrollx"><table class="summary"><thead><tr><th style="text-align:left;">Console</th><th>Sessions</th><th>Hours</th><th>Revenue</th></tr></thead>' +
      '<tbody>'+rows+'</tbody><tfoot>'+foot+'</tfoot></table></div>',
      "Paused time is excluded from both Hours and Revenue.");
  }

  // ---------- Cash report ----------
  function renderCashReport(){
    var wrap = document.getElementById("reportBodyWrap");
    if(!wrap || state.repSalesAll===null || state.repDueAll===null || REPORT_EXP_COLLECTIONS.some(function(c){return state.repExpAll[c]===undefined;})) return reportLoading();

    var cashSales=0, upiSales=0, cardSales=0, creditSales=0;
    state.repSalesAll.forEach(function(rec){
      var amt=Number(rec.amount)||0, m=rec.paymentType;
      if(m==="credit") creditSales+=amt;
      else if(m==="upi") upiSales+=amt;
      else if(m==="credit_card"||m==="debit_card") cardSales+=amt;
      else cashSales+=amt;
    });
    var cashDue=0, upiDue=0, cardDue=0;
    state.repDueAll.forEach(function(rec){
      var amt=Number(rec.amount)||0, m=rec.method;
      if(m==="upi") upiDue+=amt;
      else if(m==="credit_card"||m==="debit_card") cardDue+=amt;
      else cashDue+=amt;
    });
    var expenses=0;
    REPORT_EXP_COLLECTIONS.forEach(function(col){ (state.repExpAll[col]||[]).forEach(function(it){ expenses+=Number(it.data.amount)||0; }); });

    var cashIn = cashSales+cashDue, upiIn=upiSales+upiDue, cardIn=cashDue?cardSales+cardDue:cardSales+cardDue;
    var netCash = cashIn - expenses;

    var html = '<div class="scrollx"><table class="summary">' +
      '<tbody>' +
        '<tr><td style="text-align:left;">Cash Sales</td><td>'+fmtMoney(cashSales)+'</td></tr>' +
        '<tr><td style="text-align:left;">Cash Due Collected</td><td>'+fmtMoney(cashDue)+'</td></tr>' +
        '<tr style="font-weight:700;"><td style="text-align:left;">Total Cash In</td><td>'+fmtMoney(cashIn)+'</td></tr>' +
        '<tr><td style="text-align:left;">Cash Expenses Paid</td><td style="color:var(--pl-neg);">-'+fmtMoney(expenses)+'</td></tr>' +
        '<tr style="font-weight:700; border-top:2px solid var(--border);"><td style="text-align:left;">Net Cash Movement</td><td>'+fmtMoney(netCash)+'</td></tr>' +
      '</tbody></table></div>' +
      '<h2 style="font-size:13px; margin-top:14px;">Non-Cash</h2>' +
      '<div class="scrollx"><table class="summary"><tbody>' +
        '<tr><td style="text-align:left;">UPI (Sales + Due)</td><td>'+fmtMoney(upiSales+upiDue)+'</td></tr>' +
        '<tr><td style="text-align:left;">Card (Sales + Due)</td><td>'+fmtMoney(cardSales+cardDue)+'</td></tr>' +
        '<tr><td style="text-align:left;">Credit (Due) Given</td><td style="color:#b45309;">'+fmtMoney(creditSales)+'</td></tr>' +
      '</tbody></table></div>';

    wrap.innerHTML = reportCardShell("Cash Report", html, "Assumes all expense entries are paid in cash — reflects the physical cash drawer, not total revenue.");
  }

    var expired = state.repMembershipsAll.filter(function(m){ return !m.data.cancelled && m.data.expiryDate < today; }).length;
    var exhausted = state.repMembershipsAll.filter(function(m){ return !m.data.cancelled && m.data.expiryDate >= today && ((m.data.totalHours||0)-(m.data.hoursUsed||0)) <= 0; }).length;

      '<div style="flex:1 1 100px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Revenue</div><div style="font-size:16px; font-weight:700; color:var(--pl-pos);">'+fmtMoney(revenueInRange)+'</div></div>' +
      '<div style="flex:1 1 100px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Hours Used (range)</div><div style="font-size:16px; font-weight:700; color:#7c3aed;">'+hoursDeducted.toFixed(1)+'h</div></div>' +
      '<div style="flex:1 1 140px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Active / Exhausted / Expired</div><div style="font-size:15px; font-weight:700;">'+active+' / '+exhausted+' / '+expired+'</div></div>' +
      '<div style="flex:1 1 100px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Cancelled</div><div style="font-size:16px; font-weight:700; color:var(--pl-neg);">'+cancelledCount+'</div></div>' +
    '</div>';

    var rows = codes.length === 0
      ? '<tr><td colspan="3" style="text-align:center;color:var(--muted);">No membership play in this range.</td></tr>'
      : codes.map(function(c){
          var v = byMember[c];
          return '<tr><td style="text-align:left;">'+escapeHtml(v.name)+' ('+c+')</td><td>'+v.sessions+'</td><td>'+v.hours.toFixed(2)+'h</td></tr>';

    wrap.innerHTML = reportCardShell("Membership Report", summary +
      '<div class="scrollx"><table class="summary"><thead><tr><th style="text-align:left;">Member</th><th>Sessions</th><th>Hours Used</th></tr></thead><tbody>'+rows+'</tbody></table></div>');

  // ---------- Audit report ----------
  // Older records (written before role-tracking existed) have no
  // requestedByRole field — infer it from the name as a reasonable fallback
  // so historical entries still filter/display sensibly.
  function inferRole(r, whichField){
    var explicit = whichField === "resolved" ? r.resolvedByRole : r.requestedByRole;
    if(explicit) return explicit;
    var name = whichField === "resolved" ? r.resolvedBy : r.requestedBy;
    return (name === "Admin") ? "admin" : "staff";
  }
  function roleLabel(role){ return role === "admin" ? "Admin" : "Staff"; }

  // Shared "All Users / All Staff / All Admins / individuals" filter, used
  // identically by the Approvals and Deleted Entries sections so admin and
  // staff activity are always filterable the same way, never hidden.
  function auditFilterChipsHtml(idPrefix, currentFilter, records){
    var staffNames = [], adminNames = [];
    records.forEach(function(r){
      var role = inferRole(r, "requested");
      var name = r.requestedBy || "(unknown)";
      var bucket = role === "admin" ? adminNames : staffNames;
      if(bucket.indexOf(name) === -1) bucket.push(name);
    });
    staffNames.sort(); adminNames.sort();
    return '<button class="chip'+(currentFilter==="all"?" active":"")+'" data-'+idPrefix+'="all">All Users</button>' +
      '<button class="chip'+(currentFilter==="__staff__"?" active":"")+'" data-'+idPrefix+'="__staff__">All Staff</button>' +
      '<button class="chip'+(currentFilter==="__admin__"?" active":"")+'" data-'+idPrefix+'="__admin__">All Admins</button>' +
      staffNames.map(function(n){ return '<button class="chip'+(currentFilter===n?" active":"")+'" data-'+idPrefix+'="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>'; }).join("") +
      adminNames.map(function(n){ return '<button class="chip'+(currentFilter===n?" active":"")+'" data-'+idPrefix+'="'+escapeHtml(n)+'">'+escapeHtml(n)+' (Admin)</button>'; }).join("");
  }
  function matchAuditFilter(r, filterValue){
    if(filterValue === "all") return true;
    var role = inferRole(r, "requested");
    if(filterValue === "__staff__") return role === "staff";
    if(filterValue === "__admin__") return role === "admin";
    return (r.requestedBy||"(unknown)") === filterValue;
  }

  var auditStaffFilter = "all";

  function auditRowHtml(r){
    var desc;
    if(r.type === "cancel_item") desc = 'Cancel "'+escapeHtml(r.itemName||"item")+'" — T'+(r.tableId||"?");
    else if(r.type === "delete") desc = escapeHtml(r.itemName||"Entry deleted");
    else desc = 'Discount — T'+(r.tableId||"?")+(r.reason?' ('+escapeHtml(r.reason)+')':'');
    var statusColor = r.status==="approved" ? "var(--pl-pos)" : (r.status==="rejected" ? "var(--pl-neg)" : "#b45309");
    return '<tr><td style="text-align:left;">'+fmtDateFull((r.requestedAt||"").slice(0,10))+' '+fmtClock(r.requestedAt)+'</td>' +
      '<td style="text-align:left;">'+desc+'</td>' +
      '<td>'+fmtMoney(r.amount||0)+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.requestedBy||"")+'</td>' +
      '<td style="text-align:left;">'+roleLabel(inferRole(r,"requested"))+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.resolvedBy||"—")+'</td>' +
      '<td style="color:'+statusColor+'; font-weight:700; text-transform:capitalize;">'+r.status+'</td></tr>';
  }
  var AUDIT_THEAD = '<thead><tr><th style="text-align:left;">Date &amp; Time</th><th style="text-align:left;">Action</th><th>Amount</th><th style="text-align:left;">Requested By</th><th style="text-align:left;">Role</th><th style="text-align:left;">Resolved By</th><th>Status</th></tr></thead>';

  function auditDeleteRowHtml(r){
    return '<tr>' +
      '<td style="text-align:left;">'+fmtDateFull((r.requestedAt||"").slice(0,10))+' '+fmtClock(r.requestedAt)+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.entryType||"Entry")+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.itemName||"")+'</td>' +
      '<td>'+(r.tableId!==null&&r.tableId!==undefined ? r.tableId : "—")+'</td>' +
      '<td>'+fmtMoney(r.amount||0)+'</td>' +
      '<td style="text-align:left;">'+(r.paymentMethod ? paymentMethodLabel(r.paymentMethod) : "—")+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.requestedBy||"")+'</td>' +
      '<td style="text-align:left;">'+roleLabel(inferRole(r,"requested"))+'</td>' +
      '<td style="text-align:left;">'+escapeHtml(r.resolvedBy||"—")+'</td>' +
    '</tr>';
  }
  var AUDIT_DELETE_THEAD = '<thead><tr><th style="text-align:left;">Date &amp; Time</th><th style="text-align:left;">Entry Type</th><th style="text-align:left;">Description</th><th>Table</th><th>Deleted Amount</th><th style="text-align:left;">Payment Method</th><th style="text-align:left;">Requested By</th><th style="text-align:left;">Role</th><th style="text-align:left;">Approved By</th></tr></thead>';
  var auditDeleteStaffFilter = "all";
  var auditEditStaffFilter = "all";

  function renderAuditReport(){
    var wrap = document.getElementById("reportBodyWrap");
    if(!wrap || state.repApprovals === null) return reportLoading();

    var approvalsList = state.repApprovals.filter(function(r){ return r.type !== "delete" && r.type !== "edit"; })
      .sort(function(a,b){ return (b.requestedAt||"").localeCompare(a.requestedAt||""); });
    var deletionsList = state.repApprovals.filter(function(r){ return r.type === "delete"; })
      .sort(function(a,b){ return (b.requestedAt||"").localeCompare(a.requestedAt||""); });
    var editsList = state.repApprovals.filter(function(r){ return r.type === "edit"; })
      .sort(function(a,b){ return (b.requestedAt||"").localeCompare(a.requestedAt||""); });

    // ---- Approvals (cancellations & discounts — staff-requested AND admin-direct) ----
    var chips = auditFilterChipsHtml("auditstaff", auditStaffFilter, approvalsList);
    var filteredApprovals = approvalsList.filter(function(r){ return matchAuditFilter(r, auditStaffFilter); });

    var approvalsBody;
    if(approvalsList.length === 0){
      approvalsBody = '<div class="empty">No cancellation/discount actions in this range.</div>';
    } else if(auditStaffFilter === "all"){
      // Grouped by individual user (staff and admin alike), each with its own subtotal, plus a grand total.
      var names = [];
      approvalsList.forEach(function(r){ var n = r.requestedBy||"(unknown)"; if(names.indexOf(n)===-1) names.push(n); });
      names.sort();
      var grand = 0;
      approvalsBody = names.map(function(name){
        var rowsForUser = approvalsList.filter(function(r){ return (r.requestedBy||"(unknown)") === name; });
        var role = inferRole(rowsForUser[0], "requested");
        var subtotal = rowsForUser.reduce(function(s,r){ return s+(Number(r.amount)||0); }, 0);
        grand += subtotal;
        return '<h2 style="font-size:13px; margin-top:14px;">'+escapeHtml(name)+' <span class="badge" style="--chip:'+(role==="admin"?"#4338ca":"#0369a1")+';">'+roleLabel(role)+'</span></h2>' +
          '<div class="scrollx"><table class="summary">'+AUDIT_THEAD+'<tbody>' + rowsForUser.map(auditRowHtml).join("") + '</tbody>' +
          '<tfoot><tr style="font-weight:700;"><td style="text-align:left;" colspan="2">Total Discount/Cancelled — '+escapeHtml(name)+'</td><td>'+fmtMoney(subtotal)+'</td><td colspan="4"></td></tr></tfoot>' +
          '</table></div>';
      }).join("") +
        '<div class="totals-bar" style="margin-top:14px;"><span>Overall Grand Total (Staff + Admin)</span><span>'+fmtMoney(grand)+'</span></div>';
    } else {
      var subtotal2 = filteredApprovals.reduce(function(s,r){ return s+(Number(r.amount)||0); }, 0);
      var filterLabel = auditStaffFilter === "__staff__" ? "All Staff" : (auditStaffFilter === "__admin__" ? "All Admins" : auditStaffFilter);
      approvalsBody = filteredApprovals.length === 0
        ? '<div class="empty">No records for '+escapeHtml(filterLabel)+' in this range.</div>'
        : '<div class="scrollx"><table class="summary">'+AUDIT_THEAD+'<tbody>' + filteredApprovals.map(auditRowHtml).join("") + '</tbody>' +
          '<tfoot><tr style="font-weight:700;"><td style="text-align:left;" colspan="2">Total Discount/Cancelled — '+escapeHtml(filterLabel)+'</td><td>'+fmtMoney(subtotal2)+'</td><td colspan="4"></td></tr></tfoot>' +
          '</table></div>';
    }

    var approvalsHtml = reportCardShell("Audit Report — Discounts &amp; Cancellations",
      '<div class="chiprow" id="auditStaffChips" style="margin:0 0 10px;">'+chips+'</div>' + approvalsBody,
      "Every discount and cancellation, whether requested by staff or applied directly by admin — admin actions are never excluded.");

    // ---- Deleted Entries ----
    var delChips = auditFilterChipsHtml("auditdelstaff", auditDeleteStaffFilter, deletionsList);
    var filteredDeletions = deletionsList.filter(function(r){ return matchAuditFilter(r, auditDeleteStaffFilter); });

    var totalCount = filteredDeletions.length;
    var totalAmount = filteredDeletions.reduce(function(s,r){ return s+(Number(r.amount)||0); }, 0);

    var staffTotals = {};
    filteredDeletions.forEach(function(r){
      var name = r.requestedBy || "(unknown)";
      var label = name + " (" + roleLabel(inferRole(r,"requested")) + ")";
      staffTotals[label] = (staffTotals[label]||0) + (Number(r.amount)||0);
    });
    var tableTotals = {};
    filteredDeletions.forEach(function(r){
      if(r.tableId === null || r.tableId === undefined) return;
      tableTotals[r.tableId] = (tableTotals[r.tableId]||0) + (Number(r.amount)||0);
    });

    var summaryHtml = '<div style="display:flex; gap:10px; margin:6px 0 12px; flex-wrap:wrap;">' +
      '<div style="flex:1 1 100px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Total Deleted Entries</div><div style="font-size:16px; font-weight:700;">'+totalCount+'</div></div>' +
      '<div style="flex:1 1 100px; padding:10px; border:1px solid var(--border); border-radius:10px;"><div class="hint" style="margin:0;">Total Deleted Amount</div><div style="font-size:16px; font-weight:700; color:var(--pl-neg);">'+fmtMoney(totalAmount)+'</div></div>' +
    '</div>';

    var staffTotalsHtml = Object.keys(staffTotals).length === 0 ? '' :

  async function saveCustomerEdit(id){
    var item = (state.customersAll||[]).filter(function(c){ return c.id === id; })[0];

  function generateMembershipCode(existingCodes){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion
    var code;
    var guard = 0;
    do{
      code = "M";
      for(var i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
      guard++;
    } while(existingCodes[code] && guard < 50);
    return code;
  }

        '<tr><td>Purchased</td><td style="text-align:right;">'+fmtDateFull(d.purchaseDate)+'</td></tr>' +
        '<tr><td>Expires</td><td style="text-align:right;">'+fmtDateFull(d.expiryDate)+'</td></tr>' +

  function renderMemberStatement(memberId, deductions){

    var d = member.data;
    var totalHours = d.totalHours || 0;

    var rowsHtml = "";

    if(deductions.length === 0){
      rowsHtml = '<tr><td colspan="5" style="text-align:center;color:var(--muted);">No hours used yet.</td></tr>';
    } else {
      deductions.forEach(function(rec){
        running -= (rec.hoursUsed || 0);
        rowsHtml += '<tr>' +
          '<td style="text-align:left;">'+fmtDateFull(rec.date)+'</td>' +
          '<td>'+rec.tableNumber+'</td>' +
          '<td>'+rec.minutesUsed+' min</td>' +
          '<td>-'+(rec.hoursUsed||0).toFixed(2)+'h</td>' +
          '<td style="font-weight:700;'+(running<0?' color:var(--pl-neg);':'')+'">'+running.toFixed(2)+'h</td>' +

    wrap.innerHTML = '<div class="card">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
        '<h2 style="margin:0;">Hours Statement — '+escapeHtml(d.name)+'</h2>' +

        '<div><div class="hint" style="margin:0;">Opening Hours</div><div style="font-weight:700;">'+totalHours.toFixed(2)+'h</div></div>' +
        '<div><div class="hint" style="margin:0;">Used</div><div style="font-weight:700; color:#7c3aed;">'+(d.hoursUsed||0).toFixed(2)+'h</div></div>' +

  async function addMembership(){
    var customerId = document.getElementById("mb_customer").value;
    var planId = document.getElementById("mb_package").value;
    var pkg = (state.membershipPlansAll||[]).filter(function(p){ return p.id === planId; })[0];

    if(!customerId){ toast("Select a registered customer"); return; }
    var customer = (state.membershipCustomersAll||[]).filter(function(c){ return c.id === customerId; })[0];
    if(!customer){ toast("Couldn't find that customer — try again"); return; }
    if(!pkg){ toast("Choose a plan"); return; }
    var plan = pkg.data;

    var name = customer.data.name;
    var mobile = customer.data.whatsappDisplay || customer.data.whatsapp || "";
    if(!mobile){ toast("This customer has no mobile number on file — add one in the Customers tab first"); return; }

    var payment = readPaymentSection("mb_pay", plan.price);
    if(!payment) return;

    var btn = document.getElementById("addMembershipBtn");
    btn.disabled = true;

    var existingCodes = {};
    (state.membershipsAll||[]).forEach(function(m){ existingCodes[m.data.code] = true; });
    var code = generateMembershipCode(existingCodes);

    var today = new Date();
    var todayStr = today.getFullYear()+"-"+pad2(today.getMonth()+1)+"-"+pad2(today.getDate());
    var expiry = new Date(today.getTime() + plan.validityDays*24*60*60*1000);
    var expiryStr = expiry.getFullYear()+"-"+pad2(expiry.getMonth()+1)+"-"+pad2(expiry.getDate());
    var enteredBy = state.staffLabel || (state.role === "admin" ? "Admin" : "");
    var packageLabel = plan.name+' — '+plan.hours+'h — '+fmtMoney(plan.price)+' ('+plan.validityDays+' days) · '+resourceLabel(plan.appliesTo);

    try{
      await state.db.collection("memberships").add({
        code: code, customerId: customerId, name: name, mobile: mobile, packageLabel: packageLabel,
        planId: planId, appliesTo: plan.appliesTo,
        totalHours: plan.hours, hoursUsed: 0, price: plan.price,
        purchaseDate: todayStr, expiryDate: expiryStr,
        enteredBy: enteredBy, createdAt: new Date().toISOString()
      });
      await writePaymentLines(payment, plan.price, async function(amount, method, reference, party, info){
        await state.db.collection("sales").add({
          date: todayStr, day: DAY_NAMES[today.getDay()], source: "membership",
          amount: amount, paymentType: method, paymentReference: reference||"",
          party: (method==="credit" ? party : null),
          partyCustomerId: (method==="credit" ? info.customerId : null), partyCustomerMobile: (method==="credit" ? info.customerMobile : null),
          partyMembershipCode: (method==="credit" ? info.membershipCode : null),
          membershipCode: code, enteredBy: enteredBy, createdAt: new Date().toISOString()
        });
      });
      document.getElementById("mb_customer").value = "";
      document.getElementById("mb_customerInfo").textContent = "";
      toast("Membership "+code+" created for "+name);
    }catch(e){
      toast("Couldn't create membership");
    }
    btn.disabled = false;
  }

  var editingMembershipId = null;

  function renderMembershipList(){
    var wrap = document.getElementById("membershipListWrap");
    if(!wrap || state.membershipsAll === null) return;

    var today = (function(){ var n=new Date(); return n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-"+pad2(n.getDate()); })();
    var list = state.membershipsAll.slice().sort(function(a,b){ return (b.data.createdAt||"").localeCompare(a.data.createdAt||""); });
    if(membershipSearch){
      list = list.filter(function(m){
        var d = m.data;
        return (d.name||"").toLowerCase().indexOf(membershipSearch) !== -1 ||
               (d.code||"").toLowerCase().indexOf(membershipSearch) !== -1 ||
               (d.mobile||"").indexOf(membershipSearch) !== -1;
      });
    }

    if(list.length === 0){
      wrap.innerHTML = '<div class="empty">No memberships yet.</div>';
      return;
    }

    var html = '<div class="list">';
    list.forEach(function(item){
      var d = item.data;
      var remaining = (d.totalHours||0) - (d.hoursUsed||0);
      var expired = d.expiryDate < today;
      var exhausted = remaining <= 0;
      var cancelled = !!d.cancelled;
      var statusLabel = cancelled ? "Cancelled" : (expired ? "Expired" : (exhausted ? "Exhausted" : "Active"));
      var statusColor = cancelled ? "var(--pl-neg)" : (expired ? "#6b7280" : (exhausted ? "#b45309" : "#15803d"));

      if(editingMembershipId === item.id){
        html += '<div class="row" style="display:block; padding:12px 8px;">' +
          '<div class="hint" style="margin:0 0 8px;">'+escapeHtml(d.name)+' · '+escapeHtml(d.mobile)+
            ' — name and mobile are managed in the Customers tab, not here.</div>' +
          '<div class="field-row">' +
            '<div><label>Total Hours</label><input type="number" step="0.1" id="me_totalHours" value="'+(d.totalHours||0)+'"></div>' +
            '<div><label>Hours Used</label><input type="number" step="0.1" id="me_hoursUsed" value="'+(d.hoursUsed||0)+'"></div>' +
            '<div><label>Expiry Date</label><input type="date" id="me_expiry" value="'+d.expiryDate+'"></div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button class="btn-ghost" style="border:1px solid var(--border); margin-right:8px;" data-cancel-edit="1">Cancel</button>' +
            '<button class="btn-primary" data-save-edit="'+item.id+'">Save</button>' +
          '</div>' +
        '</div>';
      } else {
        html += '<div class="row">' +
          '<div class="main">' +
            '<div class="t1">'+escapeHtml(d.name)+' <span class="badge" style="--chip:'+statusColor+';">'+statusLabel+'</span></div>' +
            '<div class="t2">'+d.code+' · '+d.mobile+' · '+escapeHtml(d.packageLabel||"")+'</div>' +
            '<div class="t2">Used '+(d.hoursUsed||0).toFixed(1)+'h of '+(d.totalHours||0)+'h · '+
              '<span style="color:'+(remaining<=0?'var(--pl-neg)':'var(--pl-pos)')+'; font-weight:700;">'+remaining.toFixed(1)+'h left</span> · expires '+fmtDateFull(d.expiryDate)+'</div>' +
            (cancelled ? '<div class="t2" style="color:var(--pl-neg);">Cancelled '+fmtDateFull((d.cancelledAt||"").slice(0,10))+' by '+escapeHtml(d.cancelledBy||"")+' — '+escapeHtml(d.cancelledReason||"")+'</div>' : '') +
          '</div>' +
          '<button class="btn-ghost" style="border:1px solid var(--border); font-size:12px; padding:5px 9px;" data-statement="'+item.id+'">Statement</button>' +
          (state.role === "admin" ? (
            '<button class="btn-ghost" style="border:1px solid var(--border); font-size:12px; padding:5px 9px; margin-left:6px;" data-edit="'+item.id+'">Edit</button>' +
            '<button class="btn-danger" data-id="'+item.id+'" style="margin-left:6px;">Delete</button>'
          ) : '') +
        '</div>';
      }
    });
    html += '</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll("button[data-statement]").forEach(function(btn){
      btn.addEventListener("click", function(){
        openMemberStatement(btn.getAttribute("data-statement"));
      });
    });
    wrap.querySelectorAll("button[data-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        editingMembershipId = btn.getAttribute("data-edit");
        renderMembershipList();
      });
    });
    wrap.querySelectorAll("button[data-cancel-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        editingMembershipId = null;
        renderMembershipList();
      });
    });
    wrap.querySelectorAll("button[data-save-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){ saveMembershipEdit(btn.getAttribute("data-save-edit")); });
    });
    wrap.querySelectorAll("button[data-id]").forEach(function(btn){
      var id = btn.getAttribute("data-id");
      armDeleteButton(btn, function(){
        deleteWithAudit("memberships", id, {
          entryType: "Membership",
          describe: function(d){ return "Membership deleted: "+(d.name||"member")+" ("+(d.code||"")+")"; },
          getAmount: function(d){ return d.price; }
        }).then(function(ok){
          if(ok) toast("Membership deleted");
          else { toast("Couldn't delete"); btn.disabled=false; disarmDeleteButton(btn); }
        });
      });
    });
  }

  function subscribeShift(){
    cleanupUnsub();
    state.unsub = [];
    state.myOpenShift = undefined; // undefined = loading, null = none open
    state.myShiftHistory = null;
    state.allShiftsRecent = null;

    var me = currentIdentityLabel();

    state.unsub.push(state.db.collection("shifts").where("staffLabel","==",me).onSnapshot(function(snap){
      var docs = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
      docs.sort(function(a,b){ return (b.data.openedAt||"").localeCompare(a.data.openedAt||""); });
      state.myOpenShift = docs.filter(function(x){ return x.data.status === "open"; })[0] || null;
      state.myShiftHistory = docs.filter(function(x){ return x.data.status !== "open"; }).slice(0, 10);
      renderShiftContent();
    }, function(){ state.myOpenShift = null; state.myShiftHistory = []; renderShiftContent(); }));

    if(state.role === "admin"){
      state.unsub.push(state.db.collection("shifts").onSnapshot(function(snap){
        var docs = snap.docs.map(function(d){ return {id:d.id, data:d.data()}; });
        docs.sort(function(a,b){ return (b.data.openedAt||"").localeCompare(a.data.openedAt||""); });
        state.allShiftsRecent = docs.slice(0, 30);
        renderShiftHistoryAdmin();
      }, function(){ state.allShiftsRecent = []; renderShiftHistoryAdmin(); }));
    }
  }

  // Cash actually moved by this identity between `fromIso` and `toIso` (or now):
  // + cash sales, + cash due collected, − cash expenses paid out.
  async function computeShiftCashFlow(staffLabel, fromIso, toIso){
    var toBound = toIso || new Date().toISOString();
    var result = {cashSales:0, cashDue:0, cashExpenses:0};

    function sumWhere(collection, extraWhere){
      var q = state.db.collection(collection).where("enteredBy","==",staffLabel).where("createdAt",">=",fromIso).where("createdAt","<",toBound);
      return new Promise(function(resolve){
        var unsub = q.onSnapshot(function(snap){
          var total = 0;
          snap.docs.forEach(function(d){
            var v = d.data();
            if(extraWhere && !extraWhere(v)) return;
            total += Number(v.amount)||0;
          });
          resolve(total);
          // onSnapshot can fire synchronously on subscribe, before this function's
          // own `var unsub = ...` assignment has completed — defer the unsub call
          // to the next tick so it's guaranteed to exist by the time we call it.
          setTimeout(function(){ if(typeof unsub === "function") unsub(); }, 0);
        }, function(){ resolve(0); });
      });
    }

    result.cashSales = await sumWhere("sales", function(v){ return v.paymentType === "cash"; });
    result.cashDue = await sumWhere("creditPayments", function(v){ return v.method === "cash"; });
    var expCats = ["grocery","general","police","salary","charity"];
    var expTotal = 0;
    for(var i=0;i<expCats.length;i++){
      expTotal += await sumWhere(expCats[i]);
    }
    result.cashExpenses = expTotal;
    return result;
  }

  async function closeShift(btn){
    var id = btn.getAttribute("data-id");
    var expected = parseFloat(btn.getAttribute("data-expected"));
    var counted = parseFloat(document.getElementById("sh_countedCash").value);
    var notes = (document.getElementById("sh_closeNotes").value||"").trim();
    if(isNaN(counted) || counted < 0){ toast("Enter the counted cash amount"); return; }
    btn.disabled = true;
    var discrepancy = Math.round((counted - expected)*100)/100;
    try{
      await state.db.collection("shifts").doc(id).update({
        status: "closed", closedAt: new Date().toISOString(),
        closingCashExpected: Math.round(expected*100)/100, closingCashCounted: counted,
        discrepancy: discrepancy, closeNotes: notes
      });
      toast(Math.abs(discrepancy)<0.01 ? "Shift closed — cash matched exactly" : "Shift closed — "+(discrepancy>0?"over":"short")+" by "+fmtMoney(Math.abs(discrepancy)));
    }catch(e){ toast("Couldn't close shift"); btn.disabled = false; }
  }

  var SUMMARY_COLLECTIONS = ["sales","grocery","general","police","salary","charity"];

  function loadSummaryData(){
    // unsubscribe old
    state.unsubSummary.forEach(function(u){ u(); });
    state.unsubSummary = [];

    var pending = {};
    SUMMARY_COLLECTIONS.forEach(function(c){ pending[c] = true; });

    SUMMARY_COLLECTIONS.forEach(function(col){
      var start = state.year + "-01-01";
      var end = (state.year+1) + "-01-01";
      var q = state.db.collection(col).where("date", ">=", start).where("date", "<", end);
      var unsub = q.onSnapshot(function(snap){
        state.cache[col] = snap.docs.map(function(d){ return d.data(); });
        delete pending[col];
        renderSummaryTable();
      }, function(){
        state.cache[col] = state.cache[col] || [];
        delete pending[col];
        renderSummaryTable();
      });
      state.unsubSummary.push(unsub);
    });
  }

  function renderSummaryTable(){
    var body = document.getElementById("summaryBody");
    var foot = document.getElementById("summaryFoot");
    if(!body) return; // tab changed away

    var monthly = [];
    for(var i=0;i<12;i++){
      monthly.push({sales:0, grocery:0, general:0, police:0, salary:0, charity:0});

    SUMMARY_COLLECTIONS.forEach(function(col){
      (state.cache[col]||[]).forEach(function(rec){
        var mi = parseInt(rec.date.split("-")[1],10) - 1;
        if(mi<0||mi>11) return;
        var amt = Number(rec.amount)||0;
        monthly[mi][col] += amt;
      });
    });

    var totals = {sales:0, grocery:0, general:0, police:0, salary:0, charity:0, pl:0};
    var rowsHtml = "";
    monthly.forEach(function(m, idx){
      var pl = m.sales - (m.grocery + m.general + m.police + m.salary);
      totals.sales += m.sales; totals.grocery += m.grocery; totals.general += m.general;
      totals.police += m.police; totals.salary += m.salary; totals.charity += m.charity; totals.pl += pl;

        '<td>'+MONTHS[idx]+'</td>' +

        '<td>'+fmtMoney(m.charity)+'</td>' +
      '</tr>';
    });
    body.innerHTML = rowsHtml;

      '<td>TOTAL</td>' +
      '<td>'+fmtMoney(totals.sales)+'</td>' +

    if(state.tab !== "membership" && state.statementUnsub){
      state.statementUnsub();
      state.statementUnsub = null;
    }
    if(state.tab !== "membership" && state.membershipCustomersUnsub){
      state.membershipCustomersUnsub();
      state.membershipCustomersUnsub = null;
    }
    if(state.tab !== "membership" && state.membershipPlansUnsub){
      state.membershipPlansUnsub();
      state.membershipPlansUnsub = null;
    }
    if(state.tab !== "expenses" && state.expMenuUnsub){
      state.expMenuUnsub();
      state.expMenuUnsub = null;
    }
    if(state.tab !== "pos" && state.posMenuUnsub){
      state.posMenuUnsub();
      state.posMenuUnsub = null;
    }
    if(state.tab !== "pos" && state.posCustomersUnsub){
      state.posCustomersUnsub();
      state.posCustomersUnsub = null;
    }
    if(state.tab !== "pos" && state.posMembershipsUnsub){
      state.posMembershipsUnsub();
      state.posMembershipsUnsub = null;
    }
    if(state.tab !== "inventory" && state.invMenuUnsub){
      state.invMenuUnsub();
      state.invMenuUnsub = null;
    }
    if(state.tab !== "inventory" && state.invMovementsUnsub){
      state.invMovementsUnsub();
      state.invMovementsUnsub = null;
    }
    if(state.tab !== "dashboard" && state.unsubDashboard && state.unsubDashboard.length){
      state.unsubDashboard.forEach(function(u){ u(); });
      state.unsubDashboard = [];
    }
    var ySel = document.getElementById("yearSelect");
    if(ySel) ySel.value = state.year;
    var sel = document.getElementById("monthSelect");
    if(sel) sel.value = state.monthIdx;

    if(state.tab === "dashboard") return renderDashboardTab();
    if(state.tab === "tables") return renderTablesTab();
    if(state.tab === "ps5") return renderPs5Tab();
    if(state.tab === "shift") return renderShiftTab();
    if(state.tab === "pos") return renderPosTab();
    if(state.tab === "summary") return renderSummaryTab();
    if(state.tab === "expenses") return renderExpensesTab();
    if(state.tab === "credit") return renderCreditTab();
    if(state.tab === "outstanding") return renderOutstandingTab();
    if(state.tab === "reports") return renderReportsTab();
    if(state.tab === "customers") return renderCustomersTab();
    if(state.tab === "membership") return renderMembershipTab();
    if(state.tab === "inventory") return renderInventoryTab();
  }

  // ---------- boot ----------
  async function boot(){
    document.querySelector(".toprow").style.display = "none";
    document.getElementById("tabs").style.display = "none";
    document.getElementById("main").innerHTML = '<div class="card"><div class="empty">Connecting…</div></div>';
    var ok = await initDb();
    if(!ok) return;
    var role = savedRole();
    if(role){
      state.role = role;
      state.staffLabel = savedStaffLabel();
      enterApp();
    }else{
      showLoginScreen();
    }
  }

  document.addEventListener("DOMContentLoaded", boot);
  if(document.readyState === "complete" || document.readyState === "interactive"){
    boot();
  }
})();
</script>
</body>
</html>
